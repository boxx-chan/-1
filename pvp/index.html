<!doctype html>

<style>

</style></head><body><canvas id="c"></canvas>
<div id="lobby"><div class="card">
  <h1>섬광 대전</h1>
  <div class="sub">같은 와이파이나 핫스팟에 연결된 두 폰으로 1:1 대결<br>테스트 버전 · 기록과 코인에는 영향 없음 · <span id="pv"></span></div>
  <div id="pMain">
    <button id="bHost">방 만들기</button>
    <button id="bJoin" class="alt">코드로 참가</button>
    <button id="bBot" class="c" style="font-size:15px;border-color:#7fe0a0;color:#c8ffd8">봇과 연습 (혼자)</button>
  </div>
  <div id="pHost" class="hide"><div style="font-size:13px;opacity:.75">상대에게 이 코드를 알려주세요</div><div id="code">----</div><button id="bCancel1" class="c">취소</button></div>
  <div id="pJoin" class="hide"><input id="inCode" inputmode="numeric" maxlength="4" placeholder="0000"><button id="bGo" class="alt">참가</button><button id="bCancel2" class="c">취소</button></div>
  <div id="msg"></div>
  <div style="margin-top:10px"><a href="../" style="color:#8aa;font-size:12px">← 섬광으로 돌아가기</a></div>
</div></div>
<script>
'use strict';
// installed main-game app must never stay on this test page: send it back to the game
try{if((matchMedia('(display-mode: standalone)').matches||navigator.standalone)&&!/[?&]app=1/.test(location.search)){location.replace('../');}}catch(e){}
const PVER='p19';document.getElementById('pv').textContent=PVER;
/* ---------- setup ---------- */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const AW=900,AH=520,TAU=Math.PI*2,FONT='system-ui,-apple-system,"Noto Sans KR",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function segDist(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,l=vx*vx+vy*vy||1;let t=((px-x1)*vx+(py-y1)*vy)/l;t=clamp(t,0,1);return Math.hypot(px-x1-vx*t,py-y1-vy*t);}
let W=0,H=0,DPR=1,S=1,OX=0,OY=0;
const btn={atk:{x:0,y:0,r:56},dash:{x:0,y:0,r:40}};
function resize(){DPR=Math.min(devicePixelRatio||1,2);const vv=window.visualViewport;W=Math.round(vv?vv.width:innerWidth);H=Math.round(vv?vv.height:innerHeight);
  cvs.style.width=W+'px';cvs.style.height=H+'px';cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  S=Math.min(W/AW,(H-40)/AH);OX=(W-AW*S)/2;OY=40+(H-40-AH*S)/2;
  const m=Math.min(W,H);btn.atk.r=clamp(m*0.15,44,74);btn.dash.r=btn.atk.r*0.68;btn.atk.x=W-btn.atk.r-40;btn.atk.y=H-btn.atk.r-28;btn.dash.x=btn.atk.x-btn.atk.r*1.85;btn.dash.y=btn.atk.y+btn.atk.r*0.3;}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);setInterval(resize,1000);resize();
function goFS(){try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});}catch(e){}}

/* ---------- audio (tiny) ---------- */
let AC=null;function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function beep(f,d,type,v,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}
const SFX={swing:()=>beep(420,0.08,'triangle',0.06,180),hit:()=>beep(160,0.12,'square',0.09,60),flash:()=>{beep(900,0.25,'sine',0.1,1800);beep(1400,0.2,'triangle',0.05,600);},strike:()=>beep(1200,0.3,'sawtooth',0.08,90),dash:()=>beep(260,0.06,'sine',0.05,520),tink:()=>beep(1800,0.05,'triangle',0.05)};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- constants (same as main game) ---------- */
const DASH_CD=1.4,COMBO_WIN=1.2,MAX_CHARGE=2,FLASH_DUR=1.6,THRUST_L=175,CHAIN_MUL=[1,1.5,2],CHAIN_KEEP=2.5,GRACE=0.25;
const DMG={slash:8,thrust:15,strike:22},ROUNDS_WIN=2,MAXHP=100;

/* ---------- state ---------- */
let state='lobby',role='',time=0,last=performance.now();
let burstT=0,oBurstT=0,me=null,op=null,parts=[],slashes=[],lines=[],texts=[],flashT=0,hitstop=0,trauma=0;
let round=0,score=[0,0],phase='wait',phaseT=0,roundWin=-1,atkId=0,netMode='',ping=0;
function mkP(side){return{x:side?AW-150:150,y:AH/2,vx:0,vy:0,r:15,hp:MAXHP,face:side?Math.PI:0,dashT:0,dashCD:0,dx:1,dy:0,inv:0,just:0,justUsed:true,atkCD:0,comboStep:0,comboWin:0,charge:1,chain:0,chainT:0,grace:0,hurtLock:0,trail:[],flash:false,col:side?'#ff7aa8':'#5ff4ff'};}
const mySide=()=>role==='host'?0:1;
function resetRound(){inc=[];me=mkP(mySide());op=mkP(1-mySide());op.tx=op.x;op.ty=op.y;flashT=0;parts=[];slashes=[];lines=[];texts=[];}

/* ---------- fx ---------- */
function addText(x,y,s,col,size,life){texts.push({x,y,s,col,size:size||16,t:0,life:life||0.7});}
function burst(x,y,n,col,spd,life){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(spd*0.3,spd);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:life||0.4,col});}}
function sparks(x,y,a,n,col,spd){for(let i=0;i<n;i++){const b=a+rnd(-0.7,0.7),v=rnd(spd*0.4,spd);parts.push({x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,t:0,life:0.3,col});}}
function ring(x,y,r0,r1,col,life,w){parts.push({x,y,r0,r1,t:0,life,col,w:w||3,k:'r'});}

/* ---------- network ---------- */
const RT={url:'wss://zepcjksuvhpafhwxaumq.supabase.co/realtime/v1/websocket',key:'sb_publishable_N3F5KSKFTc4HX0qC3nxuWA_-B9LOLbX'};
const LOCAL=new URLSearchParams(location.search).has('local');
let sig=null,pc=null,dc=null,relay=false,connTimer=null,lastRecv=0;
function makeSig(code,onMsg,onReady){ // signaling channel: Supabase Realtime broadcast (or BroadcastChannel when ?local)
  if(LOCAL){const bc=new BroadcastChannel('fpvp-'+code);bc.onmessage=e=>onMsg(e.data.ev,e.data.p);setTimeout(onReady,50);return{send:(ev,p)=>bc.postMessage({ev,p}),close:()=>bc.close()};}
  const ws=new WebSocket(RT.url+'?apikey='+encodeURIComponent(RT.key)+'&vsn=1.0.0'),topic='realtime:fpvp-'+code;let ref=1,hb=null,open=false;
  const raw=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o));};
  ws.onopen=()=>{raw({topic,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{key:''},postgres_changes:[],private:false}},ref:String(ref++),join_ref:'1'});hb=setInterval(()=>raw({topic:'phoenix',event:'heartbeat',payload:{},ref:String(ref++)}),25000);};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(m.event==='phx_reply'&&m.topic===topic&&!open){if(m.payload&&m.payload.status==='ok'){open=true;onReady();}else setMsg('서버 연결 실패: '+JSON.stringify(m.payload).slice(0,80));}
    else if(m.event==='broadcast'&&m.payload)onMsg(m.payload.event,m.payload.payload);};
  ws.onerror=()=>setMsg('서버에 연결할 수 없어요 (인터넷 확인)');ws.onclose=()=>{clearInterval(hb);};
  return{send:(ev,p)=>raw({topic,event:'broadcast',payload:{type:'broadcast',event:ev,payload:p},ref:String(ref++),join_ref:'1'}),close:()=>{clearInterval(hb);try{ws.close()}catch(e){}}};}
function setupPC(){pc=new RTCPeerConnection({iceServers:LOCAL?[]:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onicecandidate=e=>{if(e.candidate)sig.send('ice',{from:role,c:e.candidate.toJSON()});};
  pc.ondatachannel=e=>bindDC(e.channel);
  pc.onconnectionstatechange=()=>{if(pc&&(pc.connectionState==='failed'||pc.connectionState==='disconnected')&&state==='play'&&!relay)setMsg('직접 연결 끊김');};}
function bindDC(ch){dc=ch;dc.onopen=()=>{if(relay)return;netMode='direct';onConnected();};dc.onmessage=e=>{try{onNet(JSON.parse(e.data));}catch(x){}};}
async function onSig(ev,p){try{await onSig2(ev,p);}catch(e){console.warn(e);if(!netMode&&ev!=='g'){startConnTimer();}}}
async function onSig2(ev,p){if(!p)return;
  if(ev==='hello'&&role==='host'&&!pc){setMsg('상대 발견! 연결 중...');setupPC();bindDC(pc.createDataChannel('g',{ordered:true}));const o=await pc.createOffer();await pc.setLocalDescription(o);sig.send('sdp',{from:'host',d:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});startConnTimer();}
  else if(ev==='sdp'&&p.from!==role){if(role==='guest'){if(!pc)setupPC();await pc.setRemoteDescription(p.d);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig.send('sdp',{from:'guest',d:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});startConnTimer();}else if(pc)await pc.setRemoteDescription(p.d);}
  else if(ev==='ice'&&p.from!==role&&pc){try{await pc.addIceCandidate(p.c);}catch(e){}}
  else if(ev==='relay'&&p.from!==role){if(!relay&&netMode!=='direct'){relay=true;netMode='relay';onConnected();}}
  else if(ev==='g'&&p.from!==role&&relay){onNet(p.m);}}
function startConnTimer(){clearTimeout(connTimer);connTimer=setTimeout(()=>{if(netMode)return;relay=true;netMode='relay';sig.send('relay',{from:role});setMsg('직접 연결 실패 → 서버 경유로 연결 (조금 느릴 수 있어요)');onConnected();},8000);}
function send(m){if(netMode==='bot'){botRecv(m);return;}if(netMode==='direct'&&dc&&dc.readyState==='open')dc.send(JSON.stringify(m));else if(relay&&sig)sig.send('g',{from:role,m});}
function hostRoom(){role='host';const code=String(Math.floor(1000+Math.random()*9000));show('pHost');document.getElementById('code').textContent=code;setMsg('상대를 기다리는 중...');
  sig=makeSig(code,onSig,()=>{});}
function joinRoom(code){if(!/^\d{4}$/.test(code)){setMsg('4자리 숫자를 입력하세요');return;}role='guest';setMsg('방 찾는 중...');
  sig=makeSig(code,onSig,()=>{sig.send('hello',{from:'guest'});const iv=setInterval(()=>{if(pc||netMode){clearInterval(iv);return;}sig.send('hello',{from:'guest'});},1500);setTimeout(()=>{if(!pc&&!netMode)setMsg('방을 못 찾았어요. 코드를 확인하세요');},9000);});}
function onConnected(){clearTimeout(connTimer);document.getElementById('lobby').classList.add('hide');goFS();state='play';score=[0,0];round=0;
  if(role==='host')startRound();else{resetRound();phase='wait';}
  setInterval(()=>{if(state==='play')send({t:'ping',c:performance.now()});},1000);}
function startRound(){round++;resetRound();if(netMode==='bot')B=mkP(1);phase='count';phaseT=3;roundWin=-1;send({t:'round',n:round,ph:'count',sc:score});}

/* ---------- messages ---------- */
function onNet(m){lastRecv=time;
  if(m.t==='s'){if(!op)return;op.tx=m.x;op.ty=m.y;op.vx=m.vx;op.vy=m.vy;op.face=m.f;op.dashing=m.d;op.hp=m.hp;op.charge=m.c;if(m.fl&&!op.flash){oBurstT=0.4;ring(op.tx,op.ty,10,260,'#ff7aa8',0.5,5);vib([30,40,30]);beep(300,0.25,'sawtooth',0.07,150);}op.flash=m.fl;op.pow=m.pw;if(Math.hypot(op.tx-op.x,op.ty-op.y)>200){op.x=op.tx;op.y=op.ty;}if(m.d&&!op.wasD)SFX.dash();op.wasD=m.d;}
  else if(m.t==='a')onAttack(m);
  else if(m.t==='r')onResult(m);
  else if(m.t==='ping')send({t:'pong',c:m.c});
  else if(m.t==='pong')ping=Math.round(performance.now()-m.c);
  else if(m.t==='round'){round=m.n;score=m.sc;if(m.ph==='count'){resetRound();phase='count';phaseT=3;roundWin=-1;}else if(m.ph==='end'){phase='end';phaseT=2.5;roundWin=m.w;}else if(m.ph==='match'){phase='match';roundWin=m.w;}}
  else if(m.t==='dead'&&role==='host'&&phase==='fight')endRound(0);
  else if(m.t==='bye'){opLeft=true;}
  else if(m.t==='again'&&role==='host'){score=[0,0];round=0;startRound();}}
function endRound(winnerSide){score[winnerSide]++;roundWin=winnerSide;const done=score[winnerSide]>=ROUNDS_WIN;phase=done?'match':'end';phaseT=2.5;send({t:'round',n:round,ph:done?'match':'end',w:winnerSide,sc:score});}

/* attacker side: perform attack locally (visual) and send to victim */
function doAttack(kind,a,step,ex,ey){const id=++atkId;const m={t:'a',id,k:kind,x:me.x,y:me.y,a,step,ex,ey};
  if(kind==='strike'){lines.push({x1:m.x,y1:m.y,x2:ex,y2:ey,t:0,dur:0.45,col:me.col});}
  else slashes.push({own:'me',a,range:kind==='thrust'?THRUST_L:108,arc:2.7,t:0,dur:kind==='thrust'?0.22:SLASH_DUR,step,thrust:kind==='thrust',dir:step===2?-1:1});
  send(m);}
/* victim side: decide hit / just-dodge on MY phone (dodger decides) */
function onAttack(m){if(!me||phase!=='fight')return;
  const col=op.col;
  if(m.k==='strike')lines.push({x1:m.x,y1:m.y,x2:m.ex,y2:m.ey,t:0,dur:0.45,col});
  else slashes.push({own:'op',a:m.a,range:m.k==='thrust'?THRUST_L:108,arc:2.7,t:0,dur:m.k==='thrust'?0.22:SLASH_DUR,step:m.step,thrust:m.k==='thrust',dir:m.step===2?-1:1});
  if(m.k!=='strike')SFX.swing();
  inc.push({m,t:0,v:'me'});}
/* blade sweeps over time; damage lands the moment it touches (no late-dodge grace) */
const SLASH_DUR=0.15; /* p18: instant hit like main game */let inc=[];
function touchAt(m,k,ax,ay,x,y,r,tol){
  if(m.k==='slash'){const dx=x-ax,dy=y-ay,d=Math.hypot(dx,dy);if(d>108+r)return false;if(d<r*2)return true;const dir=m.step===2?-1:1,rel=angDiff(m.a,Math.atan2(dy,dx))*dir;return rel>=-(1.35+tol)&&rel<=-1.35+2.7*k+tol;}
  if(m.k==='thrust'){const L=THRUST_L*k;return segDist(x,y,ax,ay,ax+Math.cos(m.a)*L,ay+Math.sin(m.a)*L)<r+14;}
  return segDist(x,y,m.x,m.y,m.ex,m.ey)<r+38;}
function stepInc(rdt){for(const c of inc){if(c.done)continue;c.t+=rdt;const m=c.m,k=1,bot=c.v==='bot',V=bot?B:me,A=m;
    if(!V||!A){c.done=true;continue;}
    const justOn=bot?(time-(V.dash0||-9)<0.2&&!V.justUsed):(V.just>0&&!V.justUsed);
    if(touchAt(m,k,A.x,A.y,V.x,V.y,V.r,0.15)){c.done=true;bot?botResolve(m,justOn):meResolve(m,justOn);continue;}
    if(justOn&&touchAt(m,k,A.x,A.y,V.jx0,V.jy0,V.r+34,0.3)){c.done=true;bot?botResolve(m,true):meResolve(m,true);continue;}
    if(k>=1){c.done=true;if(bot)onNet({t:'r',id:m.id,res:'miss'});else send({t:'r',id:m.id,res:'miss'});}}
  inc=inc.filter(c=>!c.done);}
function meResolve(m,just){const p=me;
  if(just){const f=triggerFlash(m.x,m.y);send({t:'r',id:m.id,res:f?'flash':'just'});return;}
  if(p.inv>0||p.grace>0){send({t:'r',id:m.id,res:'miss'});return;}
  applyHit(m);}
function applyHit(m){const p=me;if(phase!=='fight')return;
  const dmg=Math.round(m.k==='slash'?DMG.slash:m.k==='thrust'?DMG.thrust:DMG.strike*(m.mul||1));
  p.hp=Math.max(0,p.hp-dmg);const ka=Math.atan2(p.y-m.y,p.x-m.x),kb=m.k==='slash'?300:m.k==='thrust'?560:620;p.vx+=Math.cos(ka)*kb;p.vy+=Math.sin(ka)*kb;p.hurtLock=0.22;p.inv=0.12;
  addText(p.x,p.y-34,'-'+dmg,'#ff5d86',18,0.7);burst(p.x,p.y,10,'#ff5d86',300,0.35);trauma=Math.min(1,trauma+0.35);hitstop=Math.max(hitstop,0.05);SFX.hit();vib(40);
  send({t:'r',id:m.id,res:'hit',dmg,k:m.k});
  if(p.hp<=0){send({t:'dead'});if(role==='host'&&phase==='fight')endRound(1);}}
function onResult(m){if(!me)return;
  if(m.res==='hit'){const gain=m.k==='thrust'?0.5:m.k==='slash'?0.25:0;if(gain&&me.charge<MAX_CHARGE){const c0=Math.floor(me.charge);me.charge=Math.min(MAX_CHARGE,me.charge+gain);if(Math.floor(me.charge)>c0)addText(me.x,me.y-36,'섬광 '+Math.floor(me.charge),'#8ff',14,0.7);}
    if(netMode!=='bot'&&m.dmg)addText(op.x,op.y-34,'-'+m.dmg,'#ffe066',18,0.7);burst(op.x,op.y,8,'#fff',320,0.3);sparks(op.x,op.y,Math.atan2(op.y-me.y,op.x-me.x),10,'#fff',420);hitstop=Math.max(hitstop,0.07);trauma=Math.min(1,trauma+0.2);SFX.hit();vib(20);}
  else if(m.res==='flash'){addText(op.x,op.y-40,'섬광!','#ffd0e0',22,0.9);ring(op.x,op.y,10,140,op.col,0.5,4);SFX.flash();}
  else if(m.res==='just'){addText(op.x,op.y-36,'회피!','#ffd0e0',16,0.6);SFX.tink();}}

/* ---------- my player ---------- */
function triggerFlash(sx,sy){const p=me;
  if(p.charge<1){p.justUsed=true;p.dashCD=0;addText(p.x,p.y-36,'회피!','#cff',16,0.6);sparks(sx,sy,Math.atan2(p.y-sy,p.x-sx),6,'#cff',300);SFX.tink();vib(12);return false;}
  p.charge-=1;p.justUsed=true;flashT=FLASH_DUR;inp.dash=0;p.inv=Math.max(p.inv,0.6);p.dashCD=0;

  if(glow){ctx.fillStyle=`rgba(120,255,255,${0.25+0.15*Math.sin(time*16)})`;ctx.beginPath();ctx.arc(b.x,b.y,r*1.35,0,TAU);ctx.fill();}
  ctx.fillStyle=glow?'rgba(160,255,255,0.45)':`rgba(255,255,255,${active?0.22:0.08})`;ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.fill();
  ctx.strokeStyle=glow?'#cff':'rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.stroke();
  if(cd>0){ctx.strokeStyle='rgba(90,240,255,0.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(b.x,b.y,r-3,-Math.PI/2,-Math.PI/2+TAU*(1-cd));ctx.stroke();}
  txt(glow?'섬광':label,b.x,b.y,Math.round(r*0.36),glow?'#fff':'rgba(255,255,255,0.8)',800);}
function hpBar(x,y,w,hp,col,al){ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(x,y,w,12);ctx.fillStyle=col;const fw=w*clamp(hp/MAXHP,0,1);ctx.fillRect(al==='right'?x+w-fw:x,y,fw,12);}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  if(state!=='play'||!me){ctx.strokeStyle='rgba(90,140,255,0.07)';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}return;}
  const sh=trauma*trauma*14;ctx.save();ctx.translate(OX+(Math.random()*2-1)*sh,OY+(Math.random()*2-1)*sh);ctx.scale(S,S);
  ctx.fillStyle='#0a0f1f';ctx.fillRect(0,0,AW,AH);ctx.strokeStyle='rgba(90,140,255,0.08)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=AW;x+=55){ctx.moveTo(x,0);ctx.lineTo(x,AH);}for(let y=0;y<=AH;y+=55){ctx.moveTo(0,y);ctx.lineTo(AW,y);}ctx.stroke();
  ctx.strokeStyle='rgba(95,244,255,0.35)';ctx.lineWidth=3;ctx.strokeRect(0,0,AW,AH);
  for(const l of lines){const a=1-l.t/l.dur,c=l.col==='#bff'||l.col==='#5ff4ff'?'90,240,255':'255,120,170';ctx.lineCap='round';ctx.strokeStyle=`rgba(${c},${a*0.5})`;ctx.lineWidth=26*a+2;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=7*a+1;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.lineCap='butt';}
  for(const s of slashes)drawSlash2(s);drawAim();
  if(op.flash){ctx.strokeStyle=`rgba(255,120,170,${0.6+0.3*Math.sin(time*20)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(op.x,op.y,op.r+14+3*Math.sin(time*20),0,TAU);ctx.stroke();}
  drawPlayer(op,false);drawPlayer(me,true);
  for(const q of parts){const k=q.t/q.life;ctx.globalAlpha=1-k;if(q.k==='r'){ctx.strokeStyle=q.col;ctx.lineWidth=q.w;ctx.beginPath();ctx.arc(q.x,q.y,q.r0+(q.r1-q.r0)*k,0,TAU);ctx.stroke();}else{ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,4,4);}}ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=1-t.t/t.life;txt(t.s,t.x,t.y,t.size,t.col,900);}ctx.globalAlpha=1;
  ctx.restore();
  if(flashT>0||burstT>0){const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);v.addColorStop(0,'rgba(90,240,255,0)');v.addColorStop(1,`rgba(90,240,255,${0.35+0.15*Math.sin(time*18)})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    if(burstT>0.3){ctx.fillStyle=`rgba(230,255,255,${(burstT-0.3)/0.15*0.55})`;ctx.fillRect(0,0,W,H);}
    if(flashT>0){const sc=1+Math.max(0,burstT)*0.8;txt('섬광!',W/2,H*0.24,Math.round(46*sc),'#e8ffff',900);const k=flashT/FLASH_DUR,bw=Math.min(240,W*0.3);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(W/2-bw/2,H*0.24+34,bw,6);ctx.fillStyle='#5ff4ff';ctx.fillRect(W/2-bw/2,H*0.24+34,bw*k,6);txt('공격 버튼으로 일격!',W/2,H*0.24+56,13,'rgba(220,255,255,0.85)',800);}}
  if(op&&op.flash){const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);v.addColorStop(0,'rgba(255,60,120,0)');v.addColorStop(1,`rgba(255,60,120,${0.3+0.15*Math.sin(time*22)})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    if(oBurstT>0.25){ctx.fillStyle=`rgba(255,200,220,${(oBurstT-0.25)/0.15*0.35})`;ctx.fillRect(0,0,W,H);}txt('상대 섬광! 회피 준비',W/2,H*0.24,Math.round(24*(1+Math.max(0,oBurstT))),'#ffd0e0',900);}
  // HUD
  const bw=Math.min(260,W*0.3);const L=mySide()===0?me:op,R=mySide()===0?op:me;
  hpBar(14,14,bw,L.hp,L.col);hpBar(W-14-bw,14,bw,R.hp,R.col,'right');
  txt((mySide()===0?'나 ':'상대 ')+Math.max(0,L.hp),14,36,12,L.col,800,'left');txt(Math.max(0,R.hp)+(mySide()===1?' 나':' 상대'),W-14,36,12,R.col,800,'right');
  txt(score[0]+' : '+score[1],W/2,20,20,'#fff',900);txt(PVER+' · ROUND '+Math.max(1,round)+' · '+(netMode==='bot'?'봇 연습':netMode==='direct'?'직접 연결':'서버 경유')+' '+ping+'ms',W/2,40,11,'rgba(200,230,255,0.6)',700);
  // controls
  if(phase!=='match'){drawButton(btn.atk,'공격',ptr.atk!==null,0,flashT>0);drawButton(btn.dash,'회피',ptr.dash!==null,me.dashCD>0?me.dashCD/DASH_CD:0,false);
    ctx.globalAlpha=0.5;ctx.strokeStyle='#fff';ctx.lineWidth=2;if(joy.id!==null){ctx.beginPath();ctx.arc(joy.bx,joy.by,60,0,TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.x,joy.y,22,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    if(atkDrag&&atkDrag.aim){let dx=atkDrag.x-atkDrag.sx,dy=atkDrag.y-atkDrag.sy;const d=Math.hypot(dx,dy),m=btn.atk.r*0.6;if(d>m){dx=dx/d*m;dy=dy/d*m;}ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(btn.atk.x+dx,btn.atk.y+dy,btn.atk.r*0.38,0,TAU);ctx.fill();}}
  if(phase==='wait')txt('방장을 기다리는 중...',W/2,H/2,22,'#fff',900);
  if(phase==='count')txt(phaseT>0.7?String(Math.ceil(phaseT-0.7)):'시작!',W/2,H/2-20,64,'#ffe066',900);
  if(phase==='end'||phase==='match'){const iw=roundWin===mySide();ctx.fillStyle='rgba(5,7,15,0.55)';ctx.fillRect(0,0,W,H);
    txt(phase==='match'?(iw?'승리!':'패배'):(iw?'라운드 승리':'라운드 패배'),W/2,H*0.4,phase==='match'?56:40,iw?'#5ff4ff':'#ff5d86',900);
    if(phase==='match'){const r=againR();ctx.fillStyle='rgba(90,240,255,0.2)';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#5ff4ff';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);txt('다시 대결',r.x+r.w/2,r.y+r.h/2,18,opLeft?'#667':'#fff',900);const m2=menuR();ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(m2.x,m2.y,m2.w,m2.h);ctx.strokeStyle='#889';ctx.lineWidth=1.5;ctx.strokeRect(m2.x,m2.y,m2.w,m2.h);txt('메뉴로',m2.x+m2.w/2,m2.y+m2.h/2,16,'#dde',800);if(opLeft)txt('상대가 나갔어요',W/2,H*0.53,15,'#ff8da6',800);}}
  if(state==='play'&&time-lastRecv>3&&lastRecv>0)txt('상대 연결이 끊겼어요',W/2,H*0.25,18,'#ff8da6',900);}
function frame(now){const rdt=Math.min((now-last)/1000,0.05);last=now;try{update(rdt);render();}catch(e){console.error(e);}requestAnimationFrame(frame);}requestAnimationFrame(frame);

function setMsg(s){document.getElementById('msg').textContent=s;}

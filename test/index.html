function bgmWant(){if(!bgmLv||document.hidden||!AC)return null;if(state!=='play'&&state!=='pause'&&state!=='pick')return 'menu';const b=enemies.find(e=>e.type==='boss'&&!e.dead);if(!b)return 'wave';return bossKind(b)===3?'boss3':'boss1';}
function bgmNode(id){const B=BGM[id];if(!B.el){try{const a=new Audio(B.src);a.loop=true;a.preload='auto';B.el=a;const src=AC.createMediaElementSource(a);B.gn=AC.createGain();B.gn.gain.value=0;src.connect(B.gn);B.gn.connect(outBus());}catch(e){B.el=null;return null;}}return B;}
function updBgm(){if(!AC)return;const want=bgmWant(),t=AC.currentTime;
  if(want!==bgmCur){if(bgmCur){const O=BGM[bgmCur];if(O.gn){O.gn.gain.cancelScheduledValues(t);O.gn.gain.setTargetAtTime(0,t,0.25);setTimeout(()=>{if(BGM[bgmCur]!==O)O.el.pause();},1500);}}
    bgmCur=want;if(want){const N=bgmNode(want);if(N){if(want==='boss1'||want==='boss3')N.el.currentTime=0;N.el.play().catch(()=>{});}}}
  else if(bgmCur){const N=BGM[bgmCur];if(N&&N.el&&N.el.paused&&!document.hidden&&!N.pend){N.pend=1;N.el.play().catch(()=>{}).finally(()=>{N.pend=0;});}}
  if(bgmCur){const N=BGM[bgmCur];if(N&&N.gn){const duck=state==='pause'?0.35:(flashT>0||ult)?0.45:1;N.gn.gain.setTargetAtTime(0.1*bgmLv*N.g*duck,t,0.15);}}}
function setBgm(d){bgmLv=Math.max(0,Math.min(5,bgmLv+d));try{localStorage.setItem('flash_bgmv',bgmLv);}catch(e){}updBgm();}
function bgmStop(){for(const k in BGM){const B=BGM[k];if(B.el){try{B.el.pause();}catch(e){}if(B.gn)B.gn.gain.value=0;}}bgmCur=null;}

function drawBgmBtn(x,y){const w=150,h=32;rrect(x,y,w,h,9);ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fill();ctx.strokeStyle=bgmLv?'rgba(127,224,160,0.6)':'rgba(255,255,255,0.25)';ctx.lineWidth=1.5;ctx.stroke();
  bgmUI={m:{x,y,w:38,h},p:{x:x+w-38,y,w:38,h}};txt('−',x+19,y+h/2,18,bgmLv?'#fff':'rgba(255,255,255,0.3)',900);txt('+',x+w-19,y+h/2,18,bgmLv<5?'#fff':'rgba(255,255,255,0.3)',900);
  txt('♪ 음악 '+(bgmLv?bgmLv:'끔'),x+w/2,y+h/2,12,bgmLv?'#a8f0c0':'rgba(255,255,255,0.55)',800);}
const VOL_BOOST=2.5;let outB=null;
function outBus(){if(!outB){const lim=AC.createDynamicsCompressor();lim.threshold.value=-2;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=0.001;lim.release.value=0.12;lim.connect(AC.destination);outB=AC.createGain();outB.gain.value=VOL_BOOST;outB.connect(lim);}return outB;}
let AC=null,master=null,nbuf=null,revIn=null,shaper=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=0.002;comp.release.value=0.18;comp.connect(outBus());
    master=AC.createGain();master.gain.value=0.6;master.connect(comp);
    const len=AC.sampleRate*0.6|0;nbuf=AC.createBuffer(1,len,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const rl=AC.sampleRate*1.8|0,ib=AC.createBuffer(2,rl,AC.sampleRate);for(let c=0;c<2;c++){const x=ib.getChannelData(c);for(let i=0;i<rl;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2);}
    const cv=AC.createConvolver();cv.buffer=ib;const wet=AC.createGain();wet.gain.value=0.5;revIn=AC.createGain();revIn.connect(cv);cv.connect(wet);wet.connect(master);

function envG(t,vol,dur,a){const g=AC.createGain();if(a){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);}else g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+Math.max(dur,(a||0)+0.01));return g;}
function sNoise(dur,f,q,vol,type,f2,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const s=AC.createBufferSource();s.buffer=nbuf;s.playbackRate.value=o.pr||1;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=envG(t,vol,dur,o.a);s.connect(fl);fl.connect(g);outTo(g,o);s.start(t);s.stop(t+dur+0.05);}
function sTone(f1,f2,dur,vol,type,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const os=AC.createOscillator();os.type=type||'sine';os.frequency.setValueAtTime(f1,t);os.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+(o.sw||dur));if(o.det)os.detune.value=o.det;const g=envG(t,vol,dur,o.a);

function wBody(i,x,y,a,w,h,al){const B=WIMG.body;if(!B){wStamp(WT.blob[i%8],x,y,a,w,h,al);return;}ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(B,(i%8)*72,0,72,72,-w/2,-h/2,w,h);ctx.restore();}
function wMkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function wBake(){WT={blob:[],dark:[],glow:null,head:[]};
  // 물 덩어리: 픽셀 단위 불규칙 가장자리 + 깊이 그라데이션 + 물결 무늬(코스틱) + 반사광
  const S=72;for(let v=0;v<8;v++){for(const dk of [0,1]){const c=wMkC(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data;
    const f1=2+v%3,f2=5+(v*3)%4,p1=v*1.7,p2=v*2.9,q=v*0.83;
    for(let j=0;j<S;j++)for(let i=0;i<S;i++){const x=(i+0.5)/S*2-1,y=(j+0.5)/S*2-1,r=Math.hypot(x,y),an=Math.atan2(y,x);
      const er=0.78+0.09*Math.sin(an*f1+p1)+0.06*Math.sin(an*f2+p2)+0.03*Math.sin(an*11+q);
      const m=Math.max(0,Math.min(1,(er-r)/0.16));if(m<=0)continue;
      const depth=Math.max(0,Math.min(1,0.5+0.5*y-0.25*x*0.3)); // 아래쪽이 진함
      const ca=Math.abs(Math.sin(x*7+Math.sin(y*5+q)*1.6)+Math.sin(y*6.5+Math.sin(x*4.3+p1)*1.4));const caus=Math.pow(Math.max(0,1-ca*0.9),3);
      const rim=Math.pow(Math.max(0,1-Math.abs(r-er*0.86)/0.12),2)*(y<0.2?1:0.35);
      const spec=Math.pow(Math.max(0,1-Math.hypot(x+0.28,y+0.34)/0.3),2);
      let R=40+30*(1-depth),G=120+60*(1-depth),B=235+20*(1-depth);
      if(dk){R*=0.45;G*=0.55;B*=0.75;}
      const wl=Math.min(1,caus*(dk?0.35:0.75)+rim*(dk?0.3:0.8)+spec*(dk?0.3:1));
      R=R+(245-R)*wl;G=G+(252-G)*wl;B=B+(255-B)*wl;
      const k=(j*S+i)*4;d[k]=R;d[k+1]=G;d[k+2]=B;d[k+3]=255*m*(0.78+0.22*wl);}
    g.putImageData(im,0,0);(dk?WT.dark:WT.blob).push(c);}}
  // 부드러운 빛 번짐
  {const c=wMkC(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(140,200,255,0.9)');gr.addColorStop(0.35,'rgba(70,150,255,0.45)');gr.addColorStop(1,'rgba(40,100,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);WT.glow=c;}
  // 용 머리: 고해상도로 4단계(입 벌림) 미리 그림 + 번짐
  const HS=56,CW=260,CH=200,OX=150,OY=95;
  for(let f=0;f<4;f++){const c=wMkC(CW,CH),g=c.getContext('2d'),tmp=wMkC(CW,CH),tg=tmp.getContext('2d');
    dragonHead(OX,OY,0,HS,f/3,1,f*0.13,tg);
    g.globalAlpha=0.16;for(let k=0;k<10;k++){const a=k/10*TAU,r=k%2?7:4;g.drawImage(tmp,Math.cos(a)*r,Math.sin(a)*r);}
    g.globalCompositeOperation='source-atop';g.fillStyle='rgba(60,150,255,1)';g.fillRect(0,0,CW,CH);g.globalCompositeOperation='source-over';
    g.globalAlpha=1;g.drawImage(tmp,0,0);
    // 머리 표면에 물결 무늬
    const im=g.getImageData(0,0,CW,CH),d=im.data;for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){const k=(j*CW+i)*4;if(d[k+3]<200)continue;const ca=Math.abs(Math.sin(i*0.21+Math.sin(j*0.17)*1.6)+Math.sin(j*0.19+Math.sin(i*0.13)*1.4));const w=Math.pow(Math.max(0,1-ca*0.9),3)*0.55;d[k]+= (255-d[k])*w;d[k+1]+=(255-d[k+1])*w;d[k+2]+=(255-d[k+2])*w;}
    g.putImageData(im,0,0);WT.head.push({c,ox:OX,oy:OY,hs:HS});}
}
function wStamp(img,x,y,a,w,h,al){ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();}
function wSeed(s){if(s.wr)return s.wr;let v=s.ws||7;const r=()=>{v=(v*16807)%2147483647;return v/2147483647;};s.wr={ph:r()*9,k:0.9+r()*0.5,r};return s.wr;}
function waterSword(x,y,a,bl,al,fl){if(WIMG.sword){const I=WIMG.sword,k=bl/289;ctx.save();ctx.translate(x,y);ctx.rotate(a);if(fl)ctx.scale(1,-1);ctx.globalAlpha=al;ctx.drawImage(I,-85.5*k,-36.5*k,I.width*k,I.height*k);ctx.restore();ctx.globalAlpha=1;return;}ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=al;
  // glow
  ctx.lineCap='round';ctx.strokeStyle='rgba(90,170,255,0.28)';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(bl,0);ctx.stroke();
  // blade (slight curve, angled tip)
  ctx.beginPath();ctx.moveTo(6,-2.2);ctx.quadraticCurveTo(bl*0.6,-3.2,bl-7,-2.6);ctx.lineTo(bl,0.4);ctx.lineTo(bl-7,1.6);ctx.quadraticCurveTo(bl*0.6,1.4,6,2.2);ctx.closePath();
  const g=ctx.createLinearGradient(0,-3,0,3);g.addColorStop(0,'#f4f9ff');g.addColorStop(0.45,'#c7d5e6');g.addColorStop(1,'#7d91ab');ctx.fillStyle=g;ctx.fill();
  // hamon (wavy temper line)
  ctx.beginPath();for(let t=8;t<bl-8;t+=2){ctx.lineTo(t,0.3+0.7*Math.sin(t*0.55));}ctx.strokeStyle='rgba(235,245,255,0.9)';ctx.lineWidth=0.8;ctx.stroke();
  ctx.strokeStyle='rgba(120,200,255,0.8)';ctx.lineWidth=0.7;ctx.beginPath();ctx.moveTo(8,-2.4);ctx.quadraticCurveTo(bl*0.6,-3.3,bl-7,-2.7);ctx.stroke();
  // lotus guard
  for(let i=0;i<8;i++){const t=i/8*TAU;ctx.save();ctx.translate(3,0);ctx.rotate(t);ctx.beginPath();ctx.ellipse(4.2,0,3.4,1.7,0,0,TAU);ctx.fillStyle=i%2?'#2d63d6':'#4f8cff';ctx.fill();ctx.restore();}
  ctx.beginPath();ctx.arc(3,0,2.6,0,TAU);ctx.fillStyle='#bfe0ff';ctx.fill();
  // grip: navy with gold diamonds
  ctx.fillStyle='#141c3a';ctx.fillRect(-24,-2.6,24,5.2);ctx.fillStyle='#d8b25a';for(let i=0;i<5;i++){const cx=-21+i*4.6;ctx.beginPath();ctx.moveTo(cx-1.8,0);ctx.lineTo(cx,-1.8);ctx.lineTo(cx+1.8,0);ctx.lineTo(cx,1.8);ctx.fill();}
  ctx.fillStyle='#2b3f8a';ctx.fillRect(-27,-2.9,3.4,5.8);
  ctx.restore();ctx.globalAlpha=1;}
function wDrop(x,y,vx,vy){parts.push({x,y,vx,vy,t:0,life:0.25+0.35*Math.random(),col:Math.random()<0.5?'#eaf6ff':'#8fc8ff',w:1.1+1.5*Math.random(),k:'s'});}
// 1·2타: 검을 따라 S자로 꿈틀대는 물줄기(용 몸통 느낌, 머리 없음)
function waterSlash(s,x,y,pr){const R=s.range,dir=s.dir,REV=0.32,k=Math.min(1,pr/REV),e=1-Math.pow(1-k,3),lt=s.t,w=wSeed(s);
  const a0=dir>0?s.a-s.arc/2:s.a+s.arc/2,span=dir*s.arc,prog=e,al=pr<REV+0.12?1:Math.max(0,1-(pr-REV-0.12)/(1-REV-0.12));
  const N=48,P=(u,r)=>{const a=a0+span*u;return[x+Math.cos(a)*r,y+Math.sin(a)*r];};
  const tail=Math.max(0,prog-0.95);// body spans whole swept arc
  const cen=u=>R*(0.72+0.1*Math.sin(TAU*1.3*w.k*u+w.ph-lt*9*dir));
  const th=u=>{const q=(u-tail)/Math.max(0.001,prog-tail);return R*0.24*Math.pow(Math.max(0,q),0.8)*(0.75+0.25*Math.sin(u*40+lt*20))*(pr>REV?1-0.4*(pr-REV)/(1-REV):1);};
  if(al>0&&prog>0.02){if(!WT)wBake();const M=40;
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<=M;i+=2){const u=tail+(prog-tail)*i/M,[px,py]=P(u,cen(u)),t=th(u);if(t<1)continue;ctx.globalAlpha=0.45*al;ctx.drawImage(WT.glow,px-t*1.6,py-t*1.6,t*3.2,t*3.2);}
    ctx.restore();
    for(let i=0;i<=M;i++){const u=tail+(prog-tail)*i/M,[px,py]=P(u,cen(u)),t=th(u);if(t<1.2)continue;const ta=a0+span*u+dir*Math.PI/2;
      wBody(i+(w.ph*10|0),px,py,ta+0.3*Math.sin(i*1.7+lt*12),t*1.9,t*1.5,al);}
    // 바깥 물결 하이라이트
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.beginPath();for(let i=3;i<=M;i++){const u=tail+(prog-tail)*i/M,[px,py]=P(u,cen(u)+th(u)*0.48);ctx.lineTo(px,py);}ctx.strokeStyle=`rgba(225,245,255,${0.6*al})`;ctx.lineWidth=1.3;ctx.stroke();ctx.restore();}
  if(pr<REV){const la=a0+span*prog;for(let i=0;i<2;i++){const r=R*(0.6+0.4*Math.random()),sp=60+120*Math.random(),t=dir*(60+120*Math.random());wDrop(x+Math.cos(la)*r,y+Math.sin(la)*r,Math.cos(la)*sp-Math.sin(la)*t,Math.sin(la)*sp+Math.cos(la)*t);}}
  else if(al>0.15&&Math.random()<0.5){const u=Math.random()*prog,[px,py]=P(u,cen(u)),a=a0+span*u;wDrop(px,py,Math.cos(a)*40,Math.sin(a)*40+20);}

    for(let i=1;i<=M;i++){const u0=prog*(i-1)/M,u1=prog*i/M,f=Math.max(0,1-(prog-u1)*1.6)*tr;if(f<=0.03)continue;ctx.beginPath();ctx.arc(x,y,R*0.99,a0+span*u0,a0+span*u1,dir<0);ctx.strokeStyle=`rgba(210,240,255,${0.7*f*al})`;ctx.lineWidth=1.2+1.6*f;ctx.stroke();}

function dragonHead(hx,hy,a,H,jaw,al,lt,ctx){ctx.save();ctx.translate(hx,hy);ctx.rotate(a);ctx.scale(H,H);ctx.lineJoin='round';ctx.lineCap='round';
  // mane: water tufts behind head
  for(let i=0;i<6;i++){const by=-0.35+i*0.14,len=0.7+0.25*Math.sin(lt*14+i*1.7);ctx.beginPath();ctx.moveTo(-0.55,by*0.8);ctx.quadraticCurveTo(-0.95,by-0.25,-0.6-len,by*1.4-0.15);ctx.quadraticCurveTo(-0.9,by+0.05,-0.5,by*0.8+0.08);
    ctx.fillStyle=`rgba(80,160,255,${0.55*al})`;ctx.fill();}
  // horns
  for(const [y0,y1,l] of [[-0.38,-0.95,1.6],[-0.3,-0.6,1.25]]){ctx.beginPath();ctx.moveTo(-0.35,y0);ctx.quadraticCurveTo(-0.9,y0-0.25,-l,y1);ctx.strokeStyle=`rgba(225,245,255,${0.9*al})`;ctx.lineWidth=0.13;ctx.stroke();}
  // upper head + snout
  ctx.beginPath();ctx.moveTo(-0.65,0.05);ctx.quadraticCurveTo(-0.6,-0.5,-0.05,-0.42);ctx.quadraticCurveTo(0.35,-0.36,0.7,-0.22);ctx.quadraticCurveTo(1.05,-0.16,1.12,-0.02);ctx.lineTo(0.95,0.06-jaw*0.05);ctx.quadraticCurveTo(0.4,0.02,-0.1,0.12);ctx.closePath();
  let g=ctx.createLinearGradient(0,-0.5,0,0.2);g.addColorStop(0,`rgba(200,235,255,${0.95*al})`);g.addColorStop(1,`rgba(50,130,245,${0.9*al})`);ctx.fillStyle=g;ctx.fill();
  // lower jaw (opens)
  ctx.beginPath();ctx.moveTo(-0.15,0.14);ctx.quadraticCurveTo(0.35,0.12+jaw*0.25,0.9,0.12+jaw*0.42);ctx.lineTo(0.8,0.24+jaw*0.42);ctx.quadraticCurveTo(0.3,0.36+jaw*0.2,-0.4,0.32);ctx.closePath();
  ctx.fillStyle=`rgba(40,110,230,${0.9*al})`;ctx.fill();
  // fangs
  ctx.fillStyle=`rgba(245,252,255,${al})`;for(const fx of [0.55,0.8]){ctx.beginPath();ctx.moveTo(fx,0.05);ctx.lineTo(fx+0.05,0.17);ctx.lineTo(fx+0.1,0.04);ctx.fill();}
  // brow ridge + eye
  ctx.beginPath();ctx.moveTo(-0.25,-0.33);ctx.quadraticCurveTo(0.05,-0.46,0.3,-0.32);ctx.strokeStyle=`rgba(235,250,255,${0.9*al})`;ctx.lineWidth=0.07;ctx.stroke();
  ctx.beginPath();ctx.arc(0.08,-0.24,0.07,0,TAU);ctx.fillStyle=`rgba(255,255,255,${al})`;ctx.fill();
  // whiskers
  for(const sg of [1,-1]){ctx.beginPath();ctx.moveTo(0.85,-0.08);for(let t=0;t<=1;t+=0.1)ctx.lineTo(0.85-t*2.2,-0.08+sg*0.15+t*0.9*(sg>0?0.6:-0.2)+0.12*Math.sin(t*9+lt*16));ctx.strokeStyle=`rgba(210,240,255,${0.7*al})`;ctx.lineWidth=0.05;ctx.stroke();}
  ctx.restore();}
function waterThrust(s,x,y,pr,wide){const L=s.range,a=s.a,c=Math.cos(a),sn=Math.sin(a),lt=s.t,w=wSeed(s);
  const HP=0.34,hk=Math.min(1,pr/HP),he=1-Math.pow(1-hk,2.2),hd=L*he,al=pr<0.62?1:Math.max(0,1-(pr-0.62)/0.38);
  const A=(wide?26:20),WL=62*w.k,N=60,spin=lt*22;
  // spine: lateral offset = helix projection, amplitude fades near player and near head
  const sp=t=>{const d=hd*t,env=Math.min(1,d/40)*Math.min(1,(hd-d)/26+0.15);const ph=TAU*d/WL-spin+w.ph;return[d,A*env*Math.sin(ph),Math.cos(ph)];};
  const pts=[];for(let i=0;i<=N;i++){const t=i/N,[d,o,z]=sp(t);pts.push({x:x+c*d-sn*o,y:y+sn*d+c*o,z,t,w:(6+22*Math.pow(t,0.5))*(wide?1.3:1)*(pr>0.62?1-0.5*(pr-0.62)/0.38:1)});}
  if(!WT)wBake();
  const drawBody=front=>{for(let i=1;i<pts.length;i++){const p0=pts[i-1],p1=pts[i];if((p1.z>0)!==front)continue;
      const ta=Math.atan2(p1.y-p0.y,p1.x-p0.x),sz=p1.w*(front?1:0.85);
      if(WIMG.body)wBody(i+(w.ph*10|0),p1.x,p1.y,ta+0.25*Math.sin(i*2.1+lt*15),sz*1.9,sz*1.5,al*(front?1:0.5));else wStamp((front?WT.blob:WT.dark)[(i+(w.ph*10|0))%8],p1.x,p1.y,ta+0.25*Math.sin(i*2.1+lt*15),sz*1.6,sz*1.2,al);}};
  if(al>0){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=2;i<pts.length;i+=3){const p=pts[i],g=p.w*1.9;ctx.globalAlpha=0.3*al;ctx.drawImage(WT.glow,p.x-g,p.y-g,g*2,g*2);}ctx.restore();drawBody(false);}
  // sword stab: quick forward then hold
  const sk=Math.min(1,pr/0.12),sal=pr<0.5?1:Math.max(0,1-(pr-0.5)/0.15);if(sal>0)waterSword(x+c*10*sk,y+sn*10*sk,a,L-10,sal);
  if(al>0){drawBody(true);
    for(let i=6;i<N-3;i+=4){const p=pts[i],q=pts[i+1];if(p.z<=0)continue;const dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,fl=p.w*0.9*(0.8+0.3*Math.sin(lt*25+i));ctx.beginPath();ctx.moveTo(p.x+nx*p.w*0.4,p.y+ny*p.w*0.4);ctx.quadraticCurveTo(p.x+nx*fl-dx/l*fl*0.3,p.y+ny*fl-dy/l*fl*0.3,p.x-dx/l*fl*0.9+nx*fl*1.1,p.y-dy/l*fl*0.9+ny*fl*1.1);ctx.lineTo(p.x-dx/l*fl*0.5+nx*p.w*0.4,p.y-dy/l*fl*0.5+ny*p.w*0.4);ctx.fillStyle=`rgba(150,210,255,${0.75*al})`;ctx.fill();}
    const hx=x+c*hd,hy=y+sn*hd,jaw=pr<HP?0.2:Math.min(1,0.2+(pr-HP)*4)*(0.8+0.2*Math.sin(lt*30));
    {const H=(wide?27:21)*(0.7+0.3*he);if(WIMG.head){const I=WIMG.head,sc=H*4.2/170,bob=1+0.04*Math.sin(lt*30)*jaw;ctx.save();ctx.translate(hx,hy);ctx.rotate(a);ctx.scale(sc,sc*bob*(Math.cos(a)<0?-1:1));ctx.globalAlpha=al;ctx.drawImage(I,-100,-88);ctx.restore();}else{const fr=WT.head[Math.min(3,Math.round(jaw*3))],sc=H/fr.hs;ctx.save();ctx.translate(hx,hy);ctx.rotate(a);ctx.globalAlpha=al;ctx.drawImage(fr.c,-fr.ox*sc,-fr.oy*sc,fr.c.width*sc,fr.c.height*sc);ctx.restore();}ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.28*al;ctx.drawImage(WT.glow,hx-H*1.4,hy-H*1.4,H*2.8,H*2.8);ctx.restore();}
    if(Math.random()<0.9){const t=Math.random(),p=pts[Math.floor(t*N)];wDrop(p.x,p.y,-sn*(Math.random()-0.5)*160+c*40,c*(Math.random()-0.5)*160+sn*40);}
    if(pr<HP)for(let i=0;i<2;i++)wDrop(hx,hy,c*80+(Math.random()-0.5)*120,sn*80+(Math.random()-0.5)*120);}
}

function tMkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tRose(g,cx,cy,s,fill,line){g.save();g.translate(cx,cy);g.lineJoin='round';g.lineCap='round';
  // 바깥 꽃잎 5장
  g.beginPath();for(let i=0;i<=40;i++){const a=i/40*TAU,r=s*(0.86+0.14*Math.cos(a*5+0.6));g.lineTo(Math.cos(a)*r*1.12,Math.sin(a)*r*0.92);}g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=line;g.lineWidth=s*0.09;g.stroke();
  // 안쪽 소용돌이
  g.beginPath();for(let t=0;t<=1;t+=0.01){const a=t*TAU*2.4+0.5,r=s*(0.78-0.7*t);g.lineTo(Math.cos(a)*r*1.05+s*0.04,Math.sin(a)*r*0.9);}g.lineWidth=s*0.085;g.stroke();

function tStrip(k,al,t){// 형 AI 그림(붉은 기운) 칼날 따라 감싸기, 두 겹이 엇갈려 일렁임
  const I=TDK.strip;if(!I)return tTongues(k,al,t);const B=282.75,x0=-30*k,Wd=(B+60)*k;
  for(let j=0;j<2;j++){const ph=t*(j?2.1:1.6)+j*2,h=k*(62+10*Math.sin(ph*2.3)),sy=j?-1:1,dx=k*6*Math.sin(ph);
    ctx.save();ctx.scale(1,sy);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=al*(0.62+0.25*Math.sin(ph*1.7+j));ctx.drawImage(I,x0+dx,-h*0.5,Wd,h);
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al*0.35*(0.5+0.5*Math.sin(ph*3.1+j*1.3));ctx.drawImage(I,x0+dx,-h*0.5,Wd,h);ctx.restore();}
  ctx.globalCompositeOperation='source-over';}
function tTongues(k,al,t){// 칼날을 따라 타오르는 검은 불꽃 혀 (매 프레임 흔들림)
  const N=16,B=282.75;for(let pass=0;pass<2;pass++){ctx.globalCompositeOperation=pass?'source-over':'lighter';
  for(let i=0;i<N;i++){const f=i/(N-1),d=(-20+f*(B+10))*k,taper=1-0.45*f;for(const sd of [-1,1]){const ph=i*1.7+(sd>0?0:3.1),n=0.55+0.45*Math.sin(t*(7+i%3)+ph)*Math.sin(t*3.3+ph*1.9),h=k*(12+30*n)*taper,w0=k*(sd>0?7:9),bw=k*(5+4*taper),lean=-h*(0.45+0.25*Math.sin(t*5+ph)),cu=k*6*Math.sin(t*9+ph);
    ctx.beginPath();ctx.moveTo(d-bw,sd*w0*0.6);ctx.quadraticCurveTo(d-bw*0.3+lean*0.4+cu,sd*(w0+h*0.6),d+lean,sd*(w0+h));ctx.quadraticCurveTo(d+bw*0.6+lean*0.3-cu,sd*(w0+h*0.4),d+bw,sd*w0*0.6);ctx.closePath();
    if(pass){ctx.globalAlpha=al*0.88;ctx.fillStyle='#030104';ctx.fill();}else{ctx.globalAlpha=al*0.55*n;ctx.lineWidth=k*5;ctx.strokeStyle='#7a2a6a';ctx.stroke();}}}}
  ctx.globalCompositeOperation='source-over';}
function drawDk(q){const Wi=TDK['w'+(q.v%4)];if(Wi){const qa=q.t/q.life,al=(qa<0.15?qa/0.15:Math.pow(1-(qa-0.15)/0.85,1.3)),sz=q.w*(1.3+1.4*qa);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.globalAlpha=al*0.95;ctx.drawImage(Wi,-sz,-sz,sz*2,sz*2);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al*0.4;ctx.drawImage(Wi,-sz,-sz,sz*2,sz*2);ctx.restore();ctx.globalAlpha=1;return;}if(!TB||!TB.smk)return;const qa=q.t/q.life,al=(qa<0.15?qa/0.15:Math.pow(1-(qa-0.15)/0.85,1.4)),sz=q.w*(1+1.6*qa),I=TB.smk[q.v%3];ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);

  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=al*0.92;ctx.drawImage(I,-sz,-sz,sz*2,sz*2);ctx.restore();ctx.globalAlpha=1;}

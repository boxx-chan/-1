const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,S=1;
const AW=1500,AH=900,TAU=Math.PI*2,FONT='system-ui,-apple-system,"Noto Sans KR",sans-serif';
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};

const btn={atk:{x:0,y:0,r:56},dash:{x:0,y:0,r:40}};
const btnAnim={atk:0,dash:0};
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);const vv=window.visualViewport;W=Math.round(vv?vv.width:innerWidth);H=Math.round(vv?vv.height:innerHeight);cvs.style.width=W+'px';cvs.style.height=H+'px';
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);S=H/560;
  const m=Math.min(W,H);btn.atk.r=clamp(m*0.15,44,74);btn.dash.r=btn.atk.r*0.68;
  btn.atk.x=W-btn.atk.r-40;btn.atk.y=H-btn.atk.r-28;
  btn.dash.x=btn.atk.x-btn.atk.r*1.85;btn.dash.y=btn.atk.y+btn.atk.r*0.3;
}

addEventListener('orientationchange',()=>setTimeout(resize,300));document.addEventListener('fullscreenchange',()=>setTimeout(resize,200));
setInterval(()=>{const vv=window.visualViewport;const w=Math.round(vv?vv.width:innerWidth),h=Math.round(vv?vv.height:innerHeight);if(w!==W||h!==H)resize();},500);resize();
const portrait=()=>H>W*1.05;

/* ---------- audio ---------- */
let AC=null,master=null,nbuf=null,revIn=null,shaper=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=0.002;comp.release.value=0.18;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=0.6;master.connect(comp);
    const len=AC.sampleRate*0.6|0;nbuf=AC.createBuffer(1,len,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const rl=AC.sampleRate*1.8|0,ib=AC.createBuffer(2,rl,AC.sampleRate);for(let c=0;c<2;c++){const x=ib.getChannelData(c);for(let i=0;i<rl;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2);}
    const cv=AC.createConvolver();cv.buffer=ib;const wet=AC.createGain();wet.gain.value=0.5;revIn=AC.createGain();revIn.connect(cv);cv.connect(wet);wet.connect(master);
    shaper=AC.createWaveShaper();const cu=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cu[i]=Math.tanh(x*3.2);}shaper.curve=cu;const sg=AC.createGain();sg.gain.value=0.55;shaper.connect(sg);sg.connect(master);
  }catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  loadSamps();
}
function outTo(g,o){g.connect(o&&o.dist?shaper:master);if(o&&o.rv){const r=AC.createGain();r.gain.value=o.rv;g.connect(r);r.connect(revIn);}}
function envG(t,vol,dur,a){const g=AC.createGain();if(a){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);}else g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+Math.max(dur,(a||0)+0.01));return g;}
function sNoise(dur,f,q,vol,type,f2,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const s=AC.createBufferSource();s.buffer=nbuf;s.playbackRate.value=o.pr||1;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=envG(t,vol,dur,o.a);s.connect(fl);fl.connect(g);outTo(g,o);s.start(t);s.stop(t+dur+0.05);}
function sTone(f1,f2,dur,vol,type,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const os=AC.createOscillator();os.type=type||'sine';os.frequency.setValueAtTime(f1,t);os.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+(o.sw||dur));if(o.det)os.detune.value=o.det;const g=envG(t,vol,dur,o.a);
  if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(g);}else os.connect(g);outTo(g,o);os.start(t);os.stop(t+dur+0.05);}
function sRing(f,dur,vol,o){o=o||{};const P=[[1,1],[2.76,0.5],[5.4,0.28],[8.93,0.14]];for(const [m,v] of P)sTone(f*m,f*m*0.995,dur*(1.2-m*0.06),vol*v,'sine',o);}

function nearestEnemy(x,y,maxD,a,cone){
  let bestE=null,bs=1e9;
  for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d>maxD+e.r)continue;
    const ad=Math.abs(angDiff(a,Math.atan2(dy,dx)));if(ad>cone)continue;const sc=d*(1+ad*0.6);if(sc<bs){bs=sc;bestE=e;}}
  return bestE;
}
function segDist(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,l=vx*vx+vy*vy||1;let t=((px-x1)*vx+(py-y1)*vy)/l;t=clamp(t,0,1);return Math.hypot(px-x1-vx*t,py-y1-vy*t);}

function swing(){
  const p=P,mm=Math.hypot(inp.jx,inp.jy);
  const step=p.comboWin>0?(p.comboStep%3)+1:1;p.comboStep=step;
  let a;
  const fin=step===3;
  if(inp.aimA!==null){a=inp.aimA;const t=nearestEnemy(p.x,p.y,fin?60:130,a,fin?0.12:0.35);if(t)a=Math.atan2(t.y-p.y,t.x-p.x);}
  else{a=mm>0.2?Math.atan2(inp.jy,inp.jx):p.face;const t=nearestEnemy(p.x,p.y,230,a,Math.PI);if(t)a=Math.atan2(t.y-p.y,t.x-p.x);}
  p.face=a;
  p.atkCD=fin?0.5:0.32;p.comboWin=COMBO_WIN;
  p.vx+=Math.cos(a)*(fin?340:170);p.vy+=Math.sin(a)*(fin?340:170);
  SFX.swing(step,META.eq);
  let hit=0;
  if(fin){
    const L=THRUST_L*(U.chain?1.4:1),w=U.chain?28:14,ex=p.x+Math.cos(a)*L,ey=p.y+Math.sin(a)*L;
    slashes.push({a,range:L,t:0,dur:0.22,step,thrust:true});skinFx(META.eq,p.x,p.y,a,true,L,0);
    const tl=[];for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(segDist(e.x,e.y,p.x,p.y,ex,ey)<e.r+w){tl.push(e);}}
    tl.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
    tl.forEach((e,i)=>{hitEnemy(e,3*U.thrust*(U.chain?1+0.5*i:1),Math.atan2(e.y-p.y,e.x-p.x),620,false,true);hit++;});addUlt(2*hit);
    for(const b of bullets){if(!b.dead&&segDist(b.x,b.y,p.x,p.y,ex,ey)<b.r+w){b.dead=true;sparks(b.x,b.y,a,6,'#ffd27a',300);SFX.tink();score+=10;}}
    if(hit){hitstop=Math.max(hitstop,0.1);trauma=Math.min(1,trauma+0.4);vib(30);}
    else{sparks(ex,ey,a,4,'#ffe9a0',200);}
    return;
  }
  const range=108*U.range,arc=2.7,dmg=U.slash,kb=280;
  if(step===2&&U.wave)waves2.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,a,vx:Math.cos(a)*620,vy:Math.sin(a)*620,t:0,life:U.waveBig?0.65:0.45,hits:new Set(),dmg:U.slash,sc:U.waveBig?1.5:1});
  slashes.push({a,range,arc,t:0,dur:0.15,step,dir:step===2?-1:1});skinFx(META.eq,p.x,p.y,a,false,range,arc);
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
    if(d>range+e.r)continue;if(d>e.r+p.r&&Math.abs(angDiff(a,Math.atan2(dy,dx)))>arc/2+0.15)continue;
    hitEnemy(e,dmg,Math.atan2(dy,dx),kb,false);hit++;}
  addUlt(hit);
  for(const b of bullets){if(b.dead)continue;const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
    if(d<range+b.r&&Math.abs(angDiff(a,Math.atan2(dy,dx)))<arc/2+0.2){b.dead=true;sparks(b.x,b.y,Math.atan2(dy,dx),6,'#ffd27a',300);SFX.tink();score+=10;}}

function render(){

  else if(state==='shop'){drawShop();}
  else if(state==='help'){drawHelp();}

    ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);

    ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(S,S);ctx.translate(-camX,-camY);
    drawArena();drawMarkers();drawTelegraphs();

    drawEnemies();drawPlayer();drawComboGauge();drawFlashReady();drawAim();drawSlashes();drawSwordWaves();drawLines();drawParts();drawTexts();

    drawHUD();
    if(state==='play'){drawControls();drawPauseBtn();}
    if(state==='over')drawOver();
    if(state==='clear')drawClear();
    if(state==='pick')drawPick();
    if(state==='pause')drawPause();
  }
  if(portrait()){ctx.fillStyle='rgba(5,7,15,0.96)';ctx.fillRect(0,0,W,H);txt('📱 가로로 돌려주세요',W/2,H/2,20,'#fff',800);}
}
let last=performance.now();
function frame(now){
  const rdt=Math.min((now-last)/1000,0.05);last=now;time+=rdt;
  if(state==='play'&&!portrait())update(rdt);
  else if(state==='pick'){pickT+=rdt;updateFx(rdt*0.5);}
  else if(state==='shop'){updShop(rdt);}
  else if(state==='clear'){overT+=rdt;updateFx(rdt*0.4);trauma=Math.max(0,trauma-rdt*1.7);}

  render();requestAnimationFrame(frame);
}

/* ---------- audio ---------- */
let AC=null,master=null,nbuf=null,revIn=null,shaper=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=0.002;comp.release.value=0.18;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=0.6;master.connect(comp);
    const len=AC.sampleRate*0.6|0;nbuf=AC.createBuffer(1,len,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const rl=AC.sampleRate*1.8|0,ib=AC.createBuffer(2,rl,AC.sampleRate);for(let c=0;c<2;c++){const x=ib.getChannelData(c);for(let i=0;i<rl;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2);}
    const cv=AC.createConvolver();cv.buffer=ib;const wet=AC.createGain();wet.gain.value=0.5;revIn=AC.createGain();revIn.connect(cv);cv.connect(wet);wet.connect(master);
    shaper=AC.createWaveShaper();const cu=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cu[i]=Math.tanh(x*3.2);}shaper.curve=cu;const sg=AC.createGain();sg.gain.value=0.55;shaper.connect(sg);sg.connect(master);
  }catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function outTo(g,o){g.connect(o&&o.dist?shaper:master);if(o&&o.rv){const r=AC.createGain();r.gain.value=o.rv;g.connect(r);r.connect(revIn);}}
function envG(t,vol,dur,a){const g=AC.createGain();if(a){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);}else g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+Math.max(dur,(a||0)+0.01));return g;}
function sNoise(dur,f,q,vol,type,f2,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const s=AC.createBufferSource();s.buffer=nbuf;s.playbackRate.value=o.pr||1;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=envG(t,vol,dur,o.a);s.connect(fl);fl.connect(g);outTo(g,o);s.start(t);s.stop(t+dur+0.05);}
function sTone(f1,f2,dur,vol,type,o){if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);const os=AC.createOscillator();os.type=type||'sine';os.frequency.setValueAtTime(f1,t);os.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+(o.sw||dur));if(o.det)os.detune.value=o.det;const g=envG(t,vol,dur,o.a);
  if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(g);}else os.connect(g);outTo(g,o);os.start(t);os.stop(t+dur+0.05);}
function sRing(f,dur,vol,o){o=o||{};const P=[[1,1],[2.76,0.5],[5.4,0.28],[8.93,0.14]];for(const [m,v] of P)sTone(f*m,f*m*0.995,dur*(1.2-m*0.06),vol*v,'sine',o);}
let kayaBuf=null;
function gayageum(d){if(!AC)return;
  if(!kayaBuf){const sr=AC.sampleRate,len=sr*1.8|0,N=Math.round(sr/98);kayaBuf=AC.createBuffer(1,len,sr);const y=kayaBuf.getChannelData(0);let lp=0;
    for(let i=0;i<N;i++){lp=lp*0.55+(Math.random()*2-1)*0.45;y[i]=lp;}
    for(let i=N+1;i<len;i++)y[i]=0.5*(y[i-N]+y[i-N-1])*0.996;}
  const t=AC.currentTime+(d||0),src=AC.createBufferSource();src.buffer=kayaBuf;
  const pr=src.playbackRate;pr.setValueAtTime(1,t);pr.setValueAtTime(1,t+0.06);pr.exponentialRampToValueAtTime(0.8,t+1.3);
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2000;const g=AC.createGain();g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.5);
  src.connect(fl);fl.connect(g);outTo(g,{rv:0.35});src.start(t);src.stop(t+1.6);
  sNoise(0.025,1200,1.5,0.06,'bandpass',null,{d:d||0});}
let lastHitSfx=0;
const SFX={
  swing(s,sk){
    if(sk==='ghost'){this.swingB(s,1,0);this.swingB(s,0.45,0.065);this.swingB(s,0.2,0.13);return;}
    if(sk==='ink'){if(s===3)sNoise(0.18,1000,0.9,0.42,'bandpass',380,{a:0.015});else sNoise(0.22,s===2?450:750,0.8,0.4,'bandpass',s===2?900:320,{a:0.025});
      sNoise(0.15,300,0.7,0.2,'lowpass',null,{a:0.02});sNoise(0.16,3200,0.6,0.05,'highpass',1800,{a:0.03});if(s===3)gayageum(0.05);return;}
    if(sk==='bolt'){const n=s===3?5:4;for(let i=0;i<n;i++)sTone(rnd(1400,3600),rnd(180,700),0.035,0.045,'square',{d:i*0.022,lp:5200});
      sNoise(0.11,5000,0.6,0.11,'highpass',null,{a:0.005});if(s===3){sNoise(0.02,4000,0.5,0.32,'highpass');sTone(3200,110,0.13,0.07,'sawtooth',{lp:6000,rv:0.25});}return;}
    if(sk==='fire'){sNoise(s===3?0.22:0.3,s===3?700:380,0.7,0.36,'lowpass',s===3?3200:2200,{a:s===3?0.03:0.07});sNoise(0.18,1600,0.8,0.08,'bandpass',600,{a:0.04});
      for(let i=0;i<3;i++)sNoise(0.008,rnd(2500,4500),1.2,0.16,'bandpass',null,{d:rnd(0.06,0.28)});return;}
    if(sk==='sakura'){sNoise(0.18,s===2?2000:2800,1.1,0.12,'bandpass',s===2?3600:1500,{a:0.03});const f=[880,1109,1319][s-1];
      sTone(f,f,0.75,0.075,'sine',{rv:0.65,a:0.004});sTone(f*2.01,f*2.01,0.4,0.022,'sine',{rv:0.65,a:0.004});if(s===3)sTone(f*1.5,f*1.5,0.6,0.04,'triangle',{d:0.07,rv:0.65});return;}
    this.swingB(s,1,0);},
  chiching(v){sNoise(0.035,7500,2.5,0.22*v,'bandpass',9500);
    sNoise(0.14,5800,4,0.22*v,'bandpass',4600,{d:0.045,rv:0.2});},
  swingB(s,v,d){if(s===3){sNoise(0.14,6000,1.4,0.32*v,'bandpass',1800,{a:0.012,d});sNoise(0.05,9000,0.7,0.12*v,'highpass',null,{d});if(!d)this.chiching(v);}
    else{const up=s===2;
      sNoise(0.13,up?2000:4200,2.2,0.36*v,'bandpass',up?4400:1500,{a:0.008,d});
      sNoise(0.08,6000,0.8,0.06*v,'highpass',null,{a:0.006,d});
      sNoise(0.09,up?3400:4300,5,0.1*v,'bandpass',up?4200:3100,{a:0.006,d:d+0.01});
      sNoise(0.1,700,0.8,0.12*v,'lowpass',300,{a:0.01,d});}},
  hit(big){const n=performance.now();if(n-lastHitSfx<30)return;lastHitSfx=n;sTone(big?170:240,45,big?0.22:0.13,0.6,'sine');sNoise(0.07,3200,0.8,0.32,'highpass');},
  kill(){sTone(320,55,0.3,0.45,'triangle');sNoise(0.25,900,0.7,0.35,'lowpass',150);},
  dash(){sNoise(0.2,700,1.1,0.26,'bandpass',3200,{a:0.03});sNoise(0.12,5000,0.5,0.05,'highpass',null,{a:0.02});},
  flash(){sTone(1300,2600,0.55,0.22,'sine');sTone(650,1300,0.7,0.18,'triangle');sNoise(0.4,6000,0.5,0.15,'highpass');},
  strike(){sNoise(0.45,5000,0.5,0.5,'highpass',1500);sTone(130,28,0.55,0.9,'sine');},
  hurt(){sTone(180,50,0.35,0.45,'square',{lp:1200,dist:true});sNoise(0.25,500,0.8,0.35,'lowpass',120);sTone(90,40,0.3,0.4,'sine');},
  shoot(){sTone(1200,320,0.1,0.09,'square',{lp:3000});sNoise(0.04,3000,1,0.06,'bandpass');},
  lunge(){sNoise(0.14,900,2,0.17,'bandpass',300,{a:0.02});},
  slam(){sTone(95,26,0.6,0.85,'sine');sTone(70,25,0.4,0.45,'triangle',{dist:true});sNoise(0.4,420,0.6,0.5,'lowpass',60,{rv:0.3});},
  tink(){sTone(2300,1900,0.08,0.15,'triangle');},
  wave(){const ch=[523,659,784,1047];ch.forEach((f,i)=>{sTone(f,f,0.6,0.09,'triangle',{d:i*0.07,rv:0.6,a:0.005});sTone(f*2,f*2,0.4,0.025,'sine',{d:i*0.07,rv:0.6});});},
  ult(){sNoise(0.7,300,0.8,0.35,'bandpass',8000,{a:0.25,rv:0.6});sTone(60,240,0.7,0.35,'sawtooth',{lp:1500,a:0.2});sTone(110,30,1.0,0.5,'sine',{d:0.3});sNoise(0.5,500,0.7,0.35,'lowpass',80,{d:0.28,rv:0.4});}
};
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- state ---------- */
let state='title',P,enemies,bullets,parts,slashes,texts,markers,lines;

let waves2=[],realDt=0,hitstop=0,trauma=0,ts=1,flashT=0,hurtFlash=0,overT=0,camX=AW/2,camY=AH/2,time=0,bannerT=0,bannerText='',strikeFlash=0;
const VERSION='1123.5';
let hitSrc='',runT=0,endless=false,clearBonus=0;const BOSS_NAMES=['검은 파수꾼','검은 파수꾼 II','심연의 파수꾼'];
let ult=null;const ultMax=()=>U.ultFast?30:40,ultN=()=>U.ultMore?8:6;
const SKINS=[{id:'flash',name:'섬광',price:0,col:'#bff8ff'},{id:'ghost',name:'잔상',price:500,col:'#c9a0ff'},{id:'ink',name:'먹물',price:1200,col:'#e8e8ee'},
  {id:'bolt',name:'번개',price:2500,col:'#fff07a'},{id:'fire',name:'화염',price:4000,col:'#ff8a3d'},{id:'sakura',name:'벚꽃',price:6000,col:'#ffb3d6'}];

try{const m=JSON.parse(localStorage.getItem('flash_meta')||'null');if(m&&typeof m==='object'){META.coins=Math.max(0,+m.coins||0);META.own=Object.assign({flash:1},m.own||{});if(SKINS.some(k=>k.id===m.eq)&&META.own[m.eq])META.eq=m.eq;META.cleared=m.cleared||0;META.bestClear=m.bestClear||0;}}catch(e){}

const skinById=id=>SKINS.find(k=>k.id===id)||SKINS[0];
const CHAIN_MUL=[1,1.5,2],CHAIN_KEEP=2,MAX_CHARGE=3,GRACE=0.25,FLASH_CD=3,THRUST_L=175,FLASH_DUR=1.6;
let DASH_CD=0.95,COMBO_WIN=1.2,POW_DUR=3,POW_MUL=2;

function reset(){
  U={slash:1,thrust:1,strike:1,range:1,powDur:0,powMul:0,dashRed:0,comboAdd:0,wave:false,chain:false,shock:false,vamp:false,waveBig:false,ultFast:false,ultMore:false,ultFin:false,bigDmg:false};owned={};applyU();pickNext=false;waves2=[];
  ult=null;P={ult:0,chain:0,chainT:0,charge:1,flashCD:0,grace:0,pow:0,chainT:0,x:AW/2,y:AH/2,vx:0,vy:0,r:15,hp:5,maxHp:5,face:0,dashT:0,dashCD:0,dx:1,dy:0,inv:0,just:0,justUsed:true,atkCD:0,comboStep:0,comboWin:0,trail:[]};
  enemies=[];bullets=[];parts=[];slashes=[];texts=[];markers=[];lines=[];

/* ---------- input ---------- */
const keys={};
const inp={jx:0,jy:0,atk:0,dash:0,aimA:null};
let atkDrag=null;
const joy={id:null,bx:0,by:0,x:0,y:0};
const btnPtr={atk:null,dash:null};
function press(k,id){inp[k]=0.2;btnPtr[k]=id;btnAnim[k]=1;}
function goFS(){
  const el=document.documentElement;
  try{const p=el.requestFullscreen&&el.requestFullscreen({navigationUI:'hide'});
    if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});}catch(e){}
}
function menuTap(x,y){
  if(state==='pause'){const i=pauseHit(x,y);if(i===0)resumeGame();else if(i===1){reset();state='play';}else if(i===2){reset();state='title';}return;}
  if(state==='pick'){if(pickT<0.35)return;const i=pickHit(x,y);if(i>=0)choose(i);return;}
  if(state==='shop'){shopTap(x,y);return;}
  if(state==='help'){helpTap(x,y);return;}
  if(state==='title'){if(inR(x,y,shopBtnR)){openShop();return;}if(inR(x,y,helpBtnR)){state='help';helpPage=0;return;}if(x!==undefined&&!inR(x,y,startBtnR))return;reset();state='play';goFS();}
  else if(state==='over'&&overT>1.0){reset();state='play';}
  else if(state==='clear'&&overT>1.0&&x!==undefined){const rs=clearRects();if(inR(x,y,rs[0])){endless=true;state='play';last=performance.now();banner('무한 모드');}
    else if(inR(x,y,rs[1])){lastEarn=wave*20+kills;META.coins+=lastEarn;saveMeta();if(score>best){best=score;try{localStorage.setItem('flash_best',best)}catch(e){}}reset();state='title';}}
}
cvs.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  if(state!=='play'){menuTap(e.clientX,e.clientY);return;}
  const x=e.clientX,y=e.clientY;
  if(Math.hypot(x-pauseBtn().x,y-pauseBtn().y)<30){pauseGame();return;}
  if(x<W*0.45){if(joy.id===null){joy.id=e.pointerId;joy.bx=x;joy.by=y;joy.x=x;joy.y=y;}return;}
  const dd=Math.hypot(x-btn.dash.x,y-btn.dash.y),da=Math.hypot(x-btn.atk.x,y-btn.atk.y);
  if(dd<btn.dash.r*1.4&&dd<da)press('dash',e.pointerId);
  else if(btnPtr.atk===null){btnPtr.atk=e.pointerId;btnAnim.atk=1;atkDrag={sx:x,sy:y,x,y,aim:false};inp.aimA=null;}
},{passive:false});
cvs.addEventListener('pointermove',e=>{
  if(atkDrag&&e.pointerId===btnPtr.atk){atkDrag.x=e.clientX;atkDrag.y=e.clientY;const dx=atkDrag.x-atkDrag.sx,dy=atkDrag.y-atkDrag.sy;if(Math.hypot(dx,dy)>18){atkDrag.aim=true;inp.aimA=Math.atan2(dy,dx);}else{atkDrag.aim=false;inp.aimA=null;}}
  if(e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;
    const R=Math.min(70,H*0.15),dx=joy.x-joy.bx,dy=joy.y-joy.by,d=Math.hypot(dx,dy);
    if(d>R*1.3){joy.bx=joy.x-dx/d*R*1.3;joy.by=joy.y-dy/d*R*1.3;}}
},{passive:false});
function ptrUp(e){if(e.pointerId===joy.id)joy.id=null;if(btnPtr.atk===e.pointerId){btnPtr.atk=null;if(atkDrag&&state==='play'){if(!atkDrag.aim)inp.aimA=null;inp.atk=0.25;}atkDrag=null;}if(btnPtr.dash===e.pointerId)btnPtr.dash=null;}

function readMove(){
  let x=0,y=0;
  if(joy.id!==null){const R=Math.min(70,H*0.15),dx=joy.x-joy.bx,dy=joy.y-joy.by,d=Math.hypot(dx,dy);
    if(d>R*0.12){x=dx/d;y=dy/d;}}
  else{if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;if(keys.w||keys.arrowup)y-=1;if(keys.s||keys.arrowdown)y+=1;
    const d=Math.hypot(x,y);if(d>1){x/=d;y/=d;}}

/* ---------- helpers ---------- */
function nearestEnemy(x,y,maxD,a,cone){
  let bestE=null,bs=1e9;
  for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d>maxD+e.r)continue;
    const ad=Math.abs(angDiff(a,Math.atan2(dy,dx)));if(ad>cone)continue;const sc=d*(1+ad*0.6);if(sc<bs){bs=sc;bestE=e;}}
  return bestE;
}
function segDist(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,l=vx*vx+vy*vy||1;let t=((px-x1)*vx+(py-y1)*vy)/l;t=clamp(t,0,1);return Math.hypot(px-x1-vx*t,py-y1-vy*t);}
function addText(x,y,s,col,size,life){texts.push({x,y,s,col,size:size||16,t:0,life:life||0.7});}
function burst(x,y,n,col,spd,life,w){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(spd*0.3,spd);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(life*0.5,life),col,w:w||2,k:'s'});}}
function sparks(x,y,a,n,col,spd){for(let i=0;i<n;i++){const b=a+rnd(-0.7,0.7),v=rnd(spd*0.4,spd);parts.push({x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,t:0,life:rnd(0.15,0.35),col,w:rnd(1.5,3),k:'s'});}}
function ring(x,y,r0,r1,col,life,w){parts.push({x,y,r0,r1,t:0,life,col,w:w||3,k:'r'});}
function banner(s){bannerText=s;bannerT=1.4;}
function addCombo(){combo++;comboT=2.4;if(combo>maxCombo)maxCombo=combo;}
const mult=()=>1+Math.min(combo,60)/10;

/* ---------- player ---------- */
function swing(){
  const p=P,mm=Math.hypot(inp.jx,inp.jy);
  const step=p.comboWin>0?(p.comboStep%3)+1:1;p.comboStep=step;
  let a;
  const fin=step===3;
  if(inp.aimA!==null){a=inp.aimA;const t=nearestEnemy(p.x,p.y,fin?60:130,a,fin?0.12:0.35);if(t)a=Math.atan2(t.y-p.y,t.x-p.x);}
  else{a=mm>0.2?Math.atan2(inp.jy,inp.jx):p.face;const t=nearestEnemy(p.x,p.y,230,a,Math.PI);if(t)a=Math.atan2(t.y-p.y,t.x-p.x);}
  p.face=a;
  p.atkCD=fin?0.5:0.32;p.comboWin=COMBO_WIN;
  p.vx+=Math.cos(a)*(fin?340:170);p.vy+=Math.sin(a)*(fin?340:170);
  SFX.swing(step,META.eq);
  let hit=0;
  if(fin){
    const L=THRUST_L*(U.chain?1.4:1),w=U.chain?28:14,ex=p.x+Math.cos(a)*L,ey=p.y+Math.sin(a)*L;
    slashes.push({a,range:L,t:0,dur:0.22,step,thrust:true});skinFx(META.eq,p.x,p.y,a,true,L,0);
    const tl=[];for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(segDist(e.x,e.y,p.x,p.y,ex,ey)<e.r+w){tl.push(e);}}
    tl.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
    tl.forEach((e,i)=>{hitEnemy(e,3*U.thrust*(U.chain?1+0.5*i:1),Math.atan2(e.y-p.y,e.x-p.x),620,false,true);hit++;});addUlt(2*hit);
    for(const b of bullets){if(!b.dead&&segDist(b.x,b.y,p.x,p.y,ex,ey)<b.r+w){b.dead=true;sparks(b.x,b.y,a,6,'#ffd27a',300);SFX.tink();score+=10;}}
    if(hit){hitstop=Math.max(hitstop,0.1);trauma=Math.min(1,trauma+0.4);vib(30);}
    else{sparks(ex,ey,a,4,'#ffe9a0',200);}
    return;
  }
  const range=108*U.range,arc=2.7,dmg=U.slash,kb=280;
  if(step===2&&U.wave)waves2.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,a,vx:Math.cos(a)*620,vy:Math.sin(a)*620,t:0,life:U.waveBig?0.65:0.45,hits:new Set(),dmg:U.slash,sc:U.waveBig?1.5:1});
  slashes.push({a,range,arc,t:0,dur:0.15,step,dir:step===2?-1:1});skinFx(META.eq,p.x,p.y,a,false,range,arc);
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
    if(d>range+e.r)continue;if(d>e.r+p.r&&Math.abs(angDiff(a,Math.atan2(dy,dx)))>arc/2+0.15)continue;
    hitEnemy(e,dmg,Math.atan2(dy,dx),kb,false);hit++;}
  addUlt(hit);
  for(const b of bullets){if(b.dead)continue;const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
    if(d<range+b.r&&Math.abs(angDiff(a,Math.atan2(dy,dx)))<arc/2+0.2){b.dead=true;sparks(b.x,b.y,Math.atan2(dy,dx),6,'#ffd27a',300);SFX.tink();score+=10;}}
  if(hit){hitstop=Math.max(hitstop,fin?0.09:0.045);trauma=Math.min(1,trauma+(fin?0.35:0.16));vib(fin?28:12);}
}
function hitEnemy(e,dmg,a,kb,strike,pierce){
  if(e.type==='boss'){hitBoss(e,dmg,a,kb,strike,pierce);return;}
  const vul=P.pow>0&&!strike;
  if(vul)dmg*=POW_MUL;
  if(strike&&U.bigDmg&&hitSrc!=='ult'&&e.type==='brute')dmg*=1.5;
  const brk=strike||pierce;
  if(!vul&&e.type==='shield'&&e.shield&&Math.abs(angDiff(e.rot,a+Math.PI))<1.15){
    if(!brk){e.hitF=0.06;addText(e.x,e.y-e.r-14,'막힘','#cfd',13,0.45);sparks(e.x-Math.cos(a)*e.r,e.y-Math.sin(a)*e.r,a+Math.PI,6,'#efe',300);SFX.tink();
      P.vx-=Math.cos(a)*180;P.vy-=Math.sin(a)*180;e.kvx+=Math.cos(a)*60;e.kvy+=Math.sin(a)*60;return;}
    e.shield=false;addText(e.x,e.y-e.r-30,'BREAK','#ffe066',22,0.9);burst(e.x,e.y,18,'#dfffd0',420,0.5,3);ring(e.x,e.y,e.r,e.r*3.5,'#ffe066',0.35,4);
    if(strike){e.state='stun';e.t=0.8;e.poise=0;}else e.poise=Math.max(e.poise||0,0.6);hitstop=Math.max(hitstop,0.12);
  }
  if(e.type==='brute'&&strike&&(e.state==='wind'||e.state==='act')){
    e.state='stun';e.t=0.8;addText(e.x,e.y-e.r-30,'BREAK','#ffe066',22,0.9);ring(e.x,e.y,e.r,e.r*3,'#ffe066',0.35,4);hitstop=Math.max(hitstop,0.12);
  }
  e.hp-=dmg;e.hitF=0.1;
  if(!strike&&hitSrc!=='bomb'&&P.charge<MAX_CHARGE){const c0=Math.floor(P.charge);P.charge=Math.min(MAX_CHARGE,P.charge+(pierce?0.5:0.25));if(Math.floor(P.charge)>c0){addText(P.x,P.y-36,'섬광 '+Math.floor(P.charge),'#8ff',14,0.8);SFX.tink();}}
  const armor=e.type==='brute'&&(e.state==='wind'||e.state==='act');
  const k=armor?0.08:(e.type==='brute'?0.35:1);
  e.kvx+=Math.cos(a)*kb*k;e.kvy+=Math.sin(a)*kb*k;
  if(!armor){if(e.type==='brute'){if(e.state!=='rec'){e.state='stun';e.t=0.15;}}
    else if(!(e.poise>0)||e.state==='stun'){if(e.state==='wind'&&e.type==='shooter')e.fireCD=Math.max(e.fireCD,0.9);if(e.state!=='stun')e.poise=0.9;e.state='stun';e.t=0.32;}}
  else{addText(e.x,e.y-e.r-14,'아머','#c9a6ff',12,0.4);}
  if(strike&&e.type!=='brute'){e.state='stun';e.t=Math.max(e.t,0.6);}
  addCombo();
  addText(e.x+rnd(-8,8),e.y-e.r-4,fmtD(dmg),strike?'#7ff':(dmg>1.5?'#ffe066':'#fff'),strike?26:(dmg>1.5?20:16));
  sparks(e.x,e.y,a,strike?14:7,dmg>1||strike?'#fff':'#e8fbff',strike?700:450);
  SFX.hit(dmg>1||strike);
  if(e.hp<=0)killEnemy(e,vul);
}
const fmtD=d=>d%1?d.toFixed(1):String(d);
function killEnemy(e,strike){
  e.dead=true;kills++;
  if(U.vamp&&kills%25===0&&P.hp<P.maxHp){P.hp++;addText(P.x,P.y-36,'+1 ♥','#f8a',18,1);}
  const pts=Math.round(e.pts*mult()*(strike?2:1));score+=pts;
  addText(e.x,e.y-e.r-22,'+'+pts,strike?'#7ff':'#9fe',13,0.9);
  burst(e.x,e.y,e.type==='brute'?40:20,e.col,e.type==='brute'?520:380,0.6,3);
  burst(e.x,e.y,8,'#fff',260,0.3,2);
  ring(e.x,e.y,e.r,e.r*4,e.col,0.35,4);
  SFX.kill();vib(e.type==='brute'?70:30);
  hitstop=Math.max(hitstop,e.type==='brute'?0.16:0.07);trauma=Math.min(1,trauma+(e.type==='brute'?0.5:0.22));
}
function tryJust(){
  const p=P;if(p.just<=0||p.justUsed)return false;
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);
    if((e.type==='grunt'||e.type==='shield')&&((e.state==='act'&&d<e.r+p.r+34)||(e.state==='wind'&&e.t<0.22&&d<140)))return triggerFlash(e.x,e.y);
    if(e.type==='brute'&&((e.state==='wind'&&e.t<0.28)||e.state==='act')&&d<e.slamR+p.r+10)return triggerFlash(e.x,e.y);
    if(e.type==='bomber'&&e.state==='wind'&&e.t<0.24&&d<e.slamR+p.r+10)return triggerFlash(e.x,e.y);
    if(e.type==='shadow'&&((e.state==='wind'&&e.t<0.22&&d<140)||(e.state==='act'&&d<100)))return triggerFlash(e.x,e.y);
    if(e.type==='boss'){if(e.pat==='dash'&&((e.state==='wind'&&e.t<0.22&&d<320)||(e.state==='act'&&d<e.r+p.r+40)))return triggerFlash(e.x,e.y);
      if(e.pat==='slam'&&((e.state==='wind'&&e.t<0.3)||e.state==='act')&&d<e.slamR+p.r+10)return triggerFlash(e.x,e.y);}}
  for(const b of bullets){if(b.dead)continue;const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);
    if(p.just>0.11&&d<p.r+b.r+34&&(dx*b.vx+dy*b.vy)>0)return triggerFlash(b.x,b.y);}
  return false;
}
function triggerFlash(sx,sy){
  const p=P;
  if(p.charge<1){p.justUsed=true;addText(p.x,p.y-36,'회피!','#cff',16,0.6);sparks(sx,sy,Math.atan2(p.y-sy,p.x-sx),6,'#cff',300);SFX.tink();vib(12);return true;}
  p.charge-=1;p.justUsed=true;flashT=FLASH_DUR;inp.dash=0;p.inv=Math.max(p.inv,1.0);p.dashCD=0;flashes++;
  addText(p.x,p.y-40,'섬광!','#8ff',24,0.9);
  SFX.flash();vib([15,25,15]);
  ring(p.x,p.y,10,140,'#9ff',0.5,4);ring(sx,sy,5,60,'#fff',0.35,2);
  hitstop=Math.max(hitstop,0.06);score+=50;
  return true;
}
function flashStrike(){
  const p=P;
  p.chain=p.chainT>0?Math.min(3,p.chain+1):1;const cm=CHAIN_MUL[p.chain-1];
  const aim=inp.aimA;const t=aim!==null?nearestEnemy(p.x,p.y,430,aim,0.6):nearestEnemy(p.x,p.y,430,p.face,Math.PI);
  let a,len;if(t){a=Math.atan2(t.y-p.y,t.x-p.x);len=Math.hypot(t.x-p.x,t.y-p.y)+t.r+55;}else{a=aim!==null?aim:p.face;len=aim!==null?300:260;}
  const sx=p.x,sy=p.y;
  const ex=clamp(sx+Math.cos(a)*len,p.r,AW-p.r),ey=clamp(sy+Math.sin(a)*len,p.r,AH-p.r);
  let n=0;
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(segDist(e.x,e.y,sx,sy,ex,ey)<e.r+38){hitEnemy(e,6*U.strike*cm,a,560+p.chain*80,true);n++;}}
  for(const b of bullets){if(!b.dead&&segDist(b.x,b.y,sx,sy,ex,ey)<40){b.dead=true;sparks(b.x,b.y,a,5,'#ffd27a',300);}}
  for(let i=0;i<=12;i++){const k=i/12;sparks(sx+(ex-sx)*k,sy+(ey-sy)*k,a,2,'#bff',500);}
  p.x=ex;p.y=ey;p.vx=Math.cos(a)*220;p.vy=Math.sin(a)*220;p.face=a;p.inv=Math.max(p.inv,0.5);p.atkCD=0.28;p.comboWin=0;
  lines.push({x1:sx,y1:sy,x2:ex,y2:ey,t:0,dur:0.45});p.grace=GRACE;
  if(U.shock){ring(ex,ey,10,140,'#ffe066',0.4,6);hitSrc='shock';for(const e of enemies){if(!e.dead&&e.spawnT<=0&&Math.hypot(e.x-ex,e.y-ey)<140+e.r)hitEnemy(e,3*U.strike*cm,Math.atan2(e.y-ey,e.x-ex),400,true);}hitSrc='';}
  addText(ex,ey-50,'공격력 x'+POW_MUL+'!','#ffe066',22,1);p.pow=POW_DUR;p.chainT=CHAIN_KEEP;
  if(p.chain>1){addText(ex,ey-80,'연속 섬광 '+p.chain+'  ·  일격 x'+cm,p.chain===3?'#fff':'#9ff',22+p.chain*4,1.2);trauma=Math.min(1,trauma+0.2*p.chain);hitstop=Math.max(hitstop,0.15+0.04*p.chain);ring(ex,ey,10,140+p.chain*60,p.chain===3?'#fff':'#9ff',0.5,6);}
  flashT=0;ts=1;hitstop=Math.max(hitstop,n?0.17:0.1);trauma=Math.min(1,trauma+(n?0.9:0.6));strikeFlash=1;if(n){burst(ex,ey,26,'#bff',650,0.5,3);ring(ex,ey,10,170,'#fff',0.4,5);}
  SFX.strike();vib(n?[40,30,80]:60);addUlt(3);
}
function addUlt(v){if(ult||!v)return;const was=P.ult>=ultMax();P.ult=Math.min(ultMax(),P.ult+v);
  if(!was&&P.ult>=ultMax()){addText(P.x,P.y-58,'난무 준비!','#ffe066',20,1.1);ring(P.x,P.y,10,90,'#ffe066',0.45,4);SFX.tink();}}
function startUlt(){
  const p=P;p.ult=0;flashT=0;p.dashT=0;inp.dash=0;inp.atk=0;ult={i:0,t:0.05,last:null};p.just=0;p.justUsed=true;p.inv=Math.max(p.inv,1);
  addText(p.x,p.y-50,'난무!','#ffe066',30,1.1);SFX.ult();vib([20,20,20]);ring(p.x,p.y,10,200,'#ffe066',0.5,6);strikeFlash=0.6;
}
function ultDash(){
  const p=P,last=ult.i===ultN()-1;let t=null,bd=1e9;
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;const d=Math.hypot(e.x-p.x,e.y-p.y)+(e===ult.last?600:0);if(d<bd){bd=d;t=e;}}
  let a,len;if(t){a=Math.atan2(t.y-p.y,t.x-p.x);len=Math.hypot(t.x-p.x,t.y-p.y)+t.r+50;}else{a=rnd(0,TAU);len=200;}
  const sx=p.x,sy=p.y,ex=clamp(sx+Math.cos(a)*len,p.r,AW-p.r),ey=clamp(sy+Math.sin(a)*len,p.r,AH-p.r);
  let n=0;
  hitSrc='ult';for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(segDist(e.x,e.y,sx,sy,ex,ey)<e.r+38){hitEnemy(e,4*U.strike*(last?1.5:1),a,last?700:380,true);n++;}}hitSrc='';
  for(const b of bullets){if(!b.dead&&segDist(b.x,b.y,sx,sy,ex,ey)<40){b.dead=true;sparks(b.x,b.y,a,5,'#ffd27a',300);}}
  for(let i=0;i<=10;i++){const k=i/10;sparks(sx+(ex-sx)*k,sy+(ey-sy)*k,a,2,i%2?'#ffe066':'#fff',520);}
  lines.push({x1:sx,y1:sy,x2:ex,y2:ey,t:0,dur:0.4,c:'255,214,90'});
  p.x=ex;p.y=ey;p.vx=0;p.vy=0;p.face=a;p.inv=Math.max(p.inv,1);ult.last=t;
  trauma=Math.min(1,trauma+(last?0.9:0.35));if(n)hitstop=Math.max(hitstop,last?0.16:0.035);
  if(last&&U.ultFin){hitSrc='ult';for(const e of enemies){if(!e.dead&&e.spawnT<=0&&Math.hypot(e.x-ex,e.y-ey)<240+e.r)hitEnemy(e,6*U.strike,Math.atan2(e.y-ey,e.x-ex),600,true);}hitSrc='';ring(ex,ey,10,260,'#fff',0.6,10);strikeFlash=1;}
  if(last){ring(ex,ey,10,220,'#ffe066',0.5,7);burst(ex,ey,30,'#ffe066',700,0.55,3);SFX.strike();vib([40,30,90]);}
  else{SFX.swing(3);SFX.hit(true);vib(18);}
}
function updateUlt(rdt){
  ult.t-=rdt;P.inv=Math.max(P.inv,0.5);
  if(ult.t<=0){if(ult.i>=ultN()){ult=null;P.grace=GRACE;P.inv=0;P.atkCD=0.2;P.comboWin=0;return;}ultDash();ult.i++;ult.t=ult.i>=ultN()?0.25:0.12;}
}
function hurt(sx,sy){
  const p=P;p.hp--;p.inv=1.1;combo=0;hurtFlash=1;trauma=Math.min(1,trauma+0.6);hitstop=Math.max(hitstop,0.1);
  const a=Math.atan2(p.y-sy,p.x-sx);p.vx+=Math.cos(a)*380;p.vy+=Math.sin(a)*380;
  SFX.hurt();vib(160);burst(p.x,p.y,16,'#f46',300,0.5,2);
  if(p.hp<=0){state='over';overT=0;flashT=0;lastEarn=wave*20+kills;META.coins+=lastEarn;saveMeta();if(score>best){best=score;try{localStorage.setItem('flash_best',best)}catch(e){}}}
}
function enemyHits(sx,sy){
  if(tryJust())return;
  if(P.inv>0||P.grace>0)return;
  hurt(sx,sy);
}
function updatePlayer(dt){
  const p=P,mx=inp.jx,my=inp.jy,mm=Math.hypot(mx,my);
  p.dashCD-=realDt;p.atkCD-=dt;if(p.pow>0)p.pow-=dt;p.comboWin-=dt;p.inv-=dt;p.just-=dt;
  if(mm>0.1&&p.atkCD<=0.04&&p.dashT<=0)p.face=Math.atan2(my,mx);
  if(flashT>0&&inp.dash>0&&p.ult>=ultMax()&&!ult){startUlt();return;}
  if(flashT>0)inp.dash=0;
  if(inp.dash>0&&p.dashCD<=0&&p.dashT<=0){
    inp.dash=0;const a=mm>0.2?Math.atan2(my,mx):p.face;p.dx=Math.cos(a);p.dy=Math.sin(a);p.face=a;
    p.dashT=0.15;p.dashCD=DASH_CD;p.just=0.2;p.justUsed=false;
    SFX.dash();vib(8);tryJust();
  }
  if(p.dashT>0){p.dashT-=dt;p.vx=p.dx*1050;p.vy=p.dy*1050;p.trail.push({x:p.x,y:p.y,t:0});
    if(p.dashT<=0){p.vx*=0.25;p.vy*=0.25;}}
  else{
    if(inp.atk>0&&p.atkCD<=0){inp.atk=0;if(flashT>0)flashStrike();else swing();}
    const sp=p.atkCD>0.06?80:250;
    const k=Math.min(1,dt*13);p.vx+=(mx*sp-p.vx)*k;p.vy+=(my*sp-p.vy)*k;
  }
  if(p.just>0&&!p.justUsed)tryJust();
  p.x=clamp(p.x+p.vx*dt,p.r,AW-p.r);p.y=clamp(p.y+p.vy*dt,p.r,AH-p.r);
  for(const tr of p.trail)tr.t+=dt;p.trail=p.trail.filter(tr=>tr.t<0.22);
}

const ET={grunt:{r:14,hp:4,col:'#ff3d7f',pts:100},shooter:{r:13,hp:3,col:'#ffb020',pts:150},brute:{r:27,hp:14,col:'#b44dff',pts:450},shield:{r:17,hp:4,col:'#7dff6a',pts:250},bomber:{r:12,hp:2,col:'#ff6a2a',pts:200},shadow:{r:14,hp:4,col:'#7b86ff',pts:300},boss:{r:40,hp:80,col:'#ff4a5a',pts:3000}};
function makeEnemy(type,x,y){const d=ET[type];const hpScale=1+Math.max(0,wave-2)*0.25;

function drawSlashList(list,x,y,sk,wide){

      else if(sk==='fire'){const g=ctx.createLinearGradient(x,y,ex+0.01,ey);g.addColorStop(0,`rgba(255,60,20,${al*0.9})`);g.addColorStop(1,`rgba(255,220,120,${al})`);tri();ctx.fillStyle=g;ctx.fill();mid();strokeL([[`rgba(255,240,200,${al})`,2]]);}
      else if(sk==='sakura'){tri();ctx.fillStyle=`rgba(255,170,215,${al*0.8})`;ctx.fill();mid();strokeL([[`rgba(255,240,248,${al})`,2]]);}
      else{tri();ctx.fillStyle=`rgba(255,240,170,${al*0.9})`;ctx.fill();mid();strokeL([[`rgba(255,255,255,${al})`,2]]);}

    const k=Math.min(1,pr*2.4),R=s.range*(0.92+0.08*k),r=s.range*0.5,dir=s.dir;

      crescent(x,y,R,r,a0,a1,dir);ctx.fillStyle=`rgba(190,160,255,${al*0.55})`;ctx.fill();outer();strokeL([[`rgba(255,255,255,${al})`,2]]);}
    else if(sk==='ink'){const n=18,th=(R-r)*0.95;ctx.beginPath();
      for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;ctx.lineTo(x+Math.cos(t)*R,y+Math.sin(t)*R);}

      ctx.closePath();ctx.fillStyle=`rgba(10,10,16,${al*0.95})`;ctx.fill();strokeL([[`rgba(255,255,255,${al*0.3})`,1]]);outer();strokeL([[`rgba(240,240,250,${al})`,2.5]]);}

function drawOver(){
  ctx.fillStyle=`rgba(5,7,15,${Math.min(0.78,overT)})`;ctx.fillRect(0,0,W,H);
  if(overT<0.4)return;
  txt('쓰러졌다',W/2,H*0.22,Math.round(H*0.1),'#ff5d86',900);
  txt(score.toLocaleString(),W/2,H*0.38,Math.round(H*0.09),'#fff',900);
  txt(score>=best&&score>0?'최고 기록!':'최고 '+best.toLocaleString(),W/2,H*0.47,Math.round(H*0.04),score>=best?'#ffe066':'rgba(255,255,255,0.6)',700);
  const fs=Math.round(clamp(H*0.04,12,17));
  txt(`WAVE ${wave}   ·   처치 ${kills}   ·   최대 콤보 ${maxCombo}   ·   섬광 ${flashes}회`,W/2,H*0.6,fs,'rgba(200,240,255,0.85)',600);
  const ow=TRACKS.filter(c=>owned[c.id]).map(c=>c.name+' Lv'+owned[c.id]).join(' · ');if(ow)txt(ow,W/2,H*0.68,Math.round(fs*0.85),'rgba(255,230,140,0.8)',600);
  txt('+'+lastEarn.toLocaleString()+' 코인   (보유 ◆ '+META.coins.toLocaleString()+')',W/2,H*0.74,Math.round(fs*0.95),'#ffe066',800);
  if(overT>1&&Math.floor(time*2)%2===0)txt('터치해서 다시',W/2,H*0.86,Math.round(fs*1.15),'#fff',800);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='title'){drawTitle();}
  else if(state==='shop'){drawShop();}
  else if(state==='help'){drawHelp();}
  else{
    ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
    const sh=trauma*trauma*18,ox=(Math.random()*2-1)*sh,oy=(Math.random()*2-1)*sh;
    ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(S,S);ctx.translate(-camX,-camY);
    drawArena();drawMarkers();drawTelegraphs();
    for(const b of bullets){ctx.fillStyle='rgba(255,170,40,0.25)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.2,0,TAU);ctx.fill();ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();}
    drawEnemies();drawPlayer();drawComboGauge();drawFlashReady();drawAim();drawSlashes();drawSwordWaves();drawLines();drawParts();drawTexts();
    ctx.restore();
    if(flashT>0){const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,W*0.7);g.addColorStop(0,'rgba(40,120,160,0.05)');g.addColorStop(1,'rgba(40,200,255,0.28)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    if(strikeFlash>0){ctx.fillStyle=`rgba(220,255,255,${strikeFlash*0.35})`;ctx.fillRect(0,0,W,H);}
    if(hurtFlash>0){const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,W*0.65);g.addColorStop(0,'rgba(255,0,60,0)');g.addColorStop(1,`rgba(255,0,60,${hurtFlash*0.45})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    drawHUD();
    if(state==='play'){drawControls();drawPauseBtn();}
    if(state==='over')drawOver();
    if(state==='clear')drawClear();
    if(state==='pick')drawPick();
    if(state==='pause')drawPause();
  }
  if(portrait()){ctx.fillStyle='rgba(5,7,15,0.96)';ctx.fillRect(0,0,W,H);txt('📱 가로로 돌려주세요',W/2,H/2,20,'#fff',800);}
}
let last=performance.now();
function frame(now){
  const rdt=Math.min((now-last)/1000,0.05);last=now;time+=rdt;
  if(state==='play'&&!portrait())update(rdt);
  else if(state==='pick'){pickT+=rdt;updateFx(rdt*0.5);}
  else if(state==='shop'){updShop(rdt);}
  else if(state==='clear'){overT+=rdt;updateFx(rdt*0.4);trauma=Math.max(0,trauma-rdt*1.7);}
  else if(state==='over'){overT+=rdt;updateFx(rdt*0.4);trauma=Math.max(0,trauma-rdt*1.7);hurtFlash=Math.max(0,hurtFlash-rdt);}
  render();requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();joy.id=null;if(document.hidden&&state==='play')pauseGame();});
window.__g=()=>({ult,META,pv,shopUI,shopBtnR,U,owned,pickOpts,state,P,enemies,bullets,wave,score,combo,flashT,flashes,kills,inp,keys});
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
